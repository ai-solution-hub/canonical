# ID-128.3 — Nightly cocoindex integration lane (folds bl-341; absorbs
# bl-227 + bl-195 as substrate).
#
# ~76 cases across ~40-42 files under __tests__/integration/cocoindex/ +
# form-extraction{,-rls}.integration.test.ts skip in CI today because
# COCOINDEX_STAGING_URL / COCOINDEX_FIXTURE_STAGING_URL / COCOINDEX_SOURCE_PATH
# are unset everywhere except this lane. It provisions the three env vars in
# an ephemeral GH-Actions-hosted sidecar so those cases execute somewhere
# automated, off the PR critical path (S403-coverage-audit.md gap (2) HIGH).
#
# THIS FILE IS THE SOURCE OF TRUTH for the stage → walk → Vitest sequence
# (id-412, S525). It used to declare itself a READ-ONLY verbatim copy of the
# on-prem operator hook `deploy/onprem/verify/live-verify.sh` at nine points.
# That declaration was the defect, not a guardrail: it froze the copy, made
# reconciliation nobody's job, and carried the operator script's `docs/testing`
# corpus choice into a lane whose whole purpose is dogfooding the Platform
# corpus — which is why this lane had never walked that corpus at all.
#
# The operator script was DELETED at S525. It had been unrunnable since the
# fixture relocation (`b9c55abf`/`90cc3b03`/`eb9ccac9`): its step 0b hard-died
# on the absent `docs/testing`, so the "manual against-a-live-box entry point"
# it was preserved as had not worked for months and nobody hit it. It had also
# drifted three ways this file did not track — a 9-item Vitest exclude list vs
# this file's 1, a background walk pump this lane deleted at id-400 (W2), and a
# `verify_driver.py` sibling deleted at S524 (id-46 {46.12}). Same class as
# that sibling: host-side operator tooling with no automated caller, rotting
# silently behind a comment that told readers not to touch it.
#
# The manual path is now a `workflow_dispatch` of this workflow. If an
# against-a-live-B1-box hook is ever needed again, write it as a thin wrapper
# that CALLS these steps — never as a second copy of them.
#
# ID-128.3 second pass (this commit): wired COCOINDEX_DB_DSN to the existing
# STAGING_SUPABASE_DB_URL secret (no new secret minted — operator OQ
# ratified this: the DSN value equals the *_SUPABASE_DB_URL value per env)
# and dropped the Vitest step's continue-on-error guard — the lane is a real
# gate now, not a soft-fail placeholder.
#
# 8 of the 9 bl-227 stubs landed this pass (sidecar-cold-start,
# sidecar-mime-coverage, sidecar-version-metadata, stage-topology,
# latency-budget, audit-log-shipping, extract-memoisation,
# memo-hit-pipeline-run) — their beforeAll hooks previously contained only
# `FUTURE:` prose with no actual fixture-staging call; each now calls
# `stageFixture(...)` against a real checked-in fixture so the test's
# existing poll/assert body has something to observe. (id-400 postscript:
# that pass fixed the STAGING half only — several assertion bodies remained
# written against shapes the producer never emits; the id-397 triage ruled
# them and the id-400 W2 port rebuilt them — see TRIAGE.md §4.) The bl-195
# items_created no-op assertion is absorbed by memo-hit-pipeline-run's
# landed Inv-15/16 coverage (row-count-delta + audit_log-silence checks) —
# C-31 already carries that correlation load, so no separate items_created
# assertion was added (see that test file's docblock).
#
# Remaining exclusion: stage-5-failure-non-destructive. The reason CHANGED at
# id-414 AC-5/AC-6 (S535) and this note is rewritten rather than left lying:
# the `?failStage5=<mode>` directive its `injectStage5Failure` helper sends IS
# now implemented — `server.py`'s `_stage_handler` allowlists it, strips it,
# and arms a one-shot walk-scoped credential override that `_run_walk`
# consumes and restores in a `finally`.
#
# It stays excluded on a NARROWER, still-honest ground: nothing has yet
# verified end-to-end against a live sidecar that the injected credential
# actually yields the documented `AuthenticationError` on the MOCK tier — a
# mock provider need not 401 on a bogus key — nor that flow.py then resolves
# `status='failed'` with `error_class='entity_resolution_failed'`. Until one
# run proves that, this spec is unverified and saying so is the point of this
# ledger.
#
# The concurrency concern the previous note raised is REAL and was not solved,
# it was scoped: Stage 5 is a per-RUN pass, not per-document, so "fail Stage 5
# for one fixture" is not expressible at any seam — an armed directive fails
# Stage 5 for every document in that walk. That is why the directive is
# opt-in, one-shot, and restored in a `finally`, and it is documented at both
# `server.py` and `test-helpers.ts`.
#
# The `--exclude` list below is this file's OWN defer ledger — one entry,
# stage-5-failure-non-destructive. The
# other 8 landed as real tests when the bl-227 stubs were built out. (Until
# S525 this comment claimed the list was "copied VERBATIM" from the operator
# script and then named an 8-item exception in the same sentence; the script
# is deleted and the claim with it.)
#
# The v1.1 `audit_log` table remains unbuilt — audit-log-shipping and
# memo-hit-pipeline-run both probe for the table's existence and skip their
# v1.1 sub-assertion cleanly (`PGRST`-class error → early return) when it's
# absent, so landing both tests does NOT require building the table.
#
# Sidecar provisioning: this lane BUILDS the cocoindex image locally via the
# same recipe onprem-deploy.yml uses — `pack build` (pruned context = scripts/
# + requirements.lock, builder gcr.io/buildpacks/builder:google-22,
# GOOGLE_ENTRYPOINT=python3 -m scripts.cocoindex_pipeline.server) FOLLOWED BY
# the post-`pack` `docker build` layer that bakes git, openssh-client,
# LibreOffice and the ID-413 opencv-headless enforcement — but WITHOUT
# `--publish` / `--cache-image` — those are registry-backed (onprem-deploy.yml
# comment: "requires --publish; there is no persistent local volume across
# runners") and this lane has no need to publish anywhere. Dropping --publish
# makes `pack build` load the image straight into the runner's local Docker
# daemon, which is exactly what `docker run` below needs. Trade-off: no
# cross-run build-cache, so every nightly run pays the ~9-min cold dependency
# build onprem-deploy.yml's comment documents (Docling + cocoindex Rust wheel
# + ML layer) — acceptable for an off-peak, non-blocking, once-nightly lane;
# a registry-backed --cache-image is a follow-up if the cold build proves a
# problem.
#
# THE "SAME RECIPE" CLAIM WAS FALSE UNTIL S524 and is worth stating plainly,
# because it is the shape of defect this lane exists to catch and carried for
# ~4 weeks undetected: the post-`pack` layer above was applied ONLY by
# onprem-deploy.yml, so this lane exercised an image missing four packages the
# deployed one carries. Parity restored S524 by duplicating the layer; the
# duplication is interim (see the build step's own comment) and id-416 owns
# the unification.
#
# WHY BUILD RATHER THAN PULL, and why that is also interim: there is no
# ":latest" tag (only content-addressed "sha-<sha>" tags, see
# onprem-deploy.yml env.TAG) and onprem-deploy's detect-changes job gates the
# publish, so a checked-out commit with no pipeline-relevant diff may have no
# matching ghcr.io tag at all. Building fresh sidesteps that resolution
# problem — at the cost of the lane never testing the artefact that actually
# ships. The target (owner-approved S524, id-416) is a moving `:main` tag for
# the lane to pull, with the deploy composes still pinning `sha-` for
# rollback, and a local build kept only as the branch-dispatch fallback.
#
# Corpus (REWRITTEN S524, id-412 W3 — the previous text described a tree that
# had already been deleted). Two distinct things, and conflating them is the
# defect this lane carried from its creation until S524:
#
#   WALKED BASELINE — the vendored synthetic Platform corpus at
#     scripts/cocoindex_pipeline/fixtures/platform-corpus/, seeded onto the
#     bind-mount source dir by deploy/onprem/sync-platform-corpus.sh before the
#     container starts. Content documents. This is what the lane exists to
#     dogfood, and until S524 it was NEVER SEEDED AT ALL.
#
#   STAGED PER TEST — form-extraction templates (DR-117:
#     scripts/cocoindex_pipeline/fixtures/form-templates/), pushed in on demand
#     through the loopback POST /stage route by
#     `python3 -m scripts.cocoindex_pipeline.verify_driver --fixtures templates`
#     and by each test's own stageFixture() call, AFTER boot.
#
# Both are then ingested by one bearer-gated POST /walk (the stage -> walk ->
# assert sequence of ID-62 / bl-221). The old text here said the lane "reuses
# the EXISTING docs/testing/test-data fixture corpus" — that tree moved at
# b9c55abf/90cc3b03/eb9ccac9 and the sentence survived the move, which is a
# fair summary of how the wrong-corpus defect stayed invisible for so long.
#
# Postgres: the sidecar's OWN write target is COCOINDEX_DB_DSN, a fully-formed
# Supabase pooler DSN (postgresql://postgres.<ref>:<password>@aws-<n>-
# <region>.pooler.supabase.com:5432/postgres) — flow.py._resolve_db_dsn()
# deliberately REFUSES to reconstruct this from SUPABASE_URL (see
# docs/audits/cocoindex-state-db-connection-crash-2026-05-26.md — a prior
# NXDOMAIN incident from exactly that reconstruction). This lane points
# COCOINDEX_DB_DSN at the SAME Staging Supabase project SUPABASE_URL /
# SUPABASE_SERVICE_ROLE_KEY already target below — the Vitest poll layer
# (__tests__/integration/cocoindex/_helpers/fixture-staging.ts,
# createLiveServiceClient()) talks PostgREST via the Supabase JS client, which
# only a real Supabase project can serve (a bare `postgres:16` service
# container has no PostgREST in front of it), so a standalone throwaway
# Postgres is NOT provisioned here. No separate "fixture-staging" service
# exists either — `/stage` is a route on the SAME sidecar server.py exposes
# `/health` and `/walk` on (empirically confirmed by reading server.py) — so
# COCOINDEX_FIXTURE_STAGING_URL and COCOINDEX_STAGING_URL take the identical
# value and both nightly env vars below point at the one running container.
#
# RESOLVED (was OPEN QUESTION / KNOWN GAP): COCOINDEX_DB_DSN does not need a
# separately-minted secret. Operator OQ ratified (S455 pickup): the GitHub
# Staging environment already carries STAGING_SUPABASE_DB_URL (also used by
# api-view-coverage.yml / schema-parity.yml), and COCOINDEX_DB_DSN's value
# equals that per-env DSN — so this lane sources it from the SAME existing
# secret rather than minting a new one. The Vitest step below no longer
# carries `continue-on-error` — the lane is a real gate now.
#
# Required secrets / vars (Staging environment scope — per
# docs/runbooks/github-environments.md §3.1), all already provisioned:
#   Secrets:
#     SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PUBLISHABLE_KEY, POSTGRES_PASSWORD,
#     ANTHROPIC_API_KEY, OPENAI_API_KEY, CRON_SECRET,
#     PIPELINE_TRIGGER_SECRET (the ONLY bearer /walk accepts since ID-127.18
#     retired the CRON_SECRET dual-accept fallback — see scripts/
#     cocoindex_pipeline/server.py's /walk auth block; both curl calls below
#     send this),
#     TEST_USER_{1,2,3}_PASSWORD, STAGING_SUPABASE_DB_URL (sources
#     COCOINDEX_DB_DSN below — no new secret),
#     PIPELINE_RUN_WEBHOOK_URL (the `pipeline_runs` round-trip — see the
#     next block)
#   Vars:
#     SUPABASE_URL, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_CLIENT_ID,
#     AI_EMBEDDING_MODEL, AI_EMBEDDING_DIMS, TEST_USER_{1,2,3}_EMAIL
#
# `pipeline_runs` ROUND-TRIP + ITS STATED EXTERNAL DEPENDENCY.
# The sidecar does NOT write `pipeline_runs` itself. `_emit_pipeline_run_webhook`
# (scripts/cocoindex_pipeline/flow.py) POSTs the rollup — `in_progress` at flow
# start, one terminal status at flow end — to PIPELINE_RUN_WEBHOOK_URL, and the
# receiving app route `/api/internal/pipeline-runs/record` performs the ONLY
# `recordPipelineRun` -> `pipeline_runs` write (Inv-18). With the URL unset the
# emission is SILENTLY SKIPPED (best-effort by design: flow.py logs a warning
# and returns, the walk still succeeds), so no row ever lands and every case
# that polls for one times out with no signal pointing at the cause. That is
# what happened in run 30272898165. The bearer half was already wired
# (PIPELINE_TRIGGER_SECRET, below); only the URL was missing.
#
# Bearer, confirmed from source (both halves agree — no CRON_SECRET anywhere in
# this path): flow.py sends `Bearer $PIPELINE_TRIGGER_SECRET` and the route
# gates on `verifyPipelineTriggerAuth` (lib/cron-auth.ts), which is
# PIPELINE_TRIGGER_SECRET-ONLY since ID-127.18 retired the legacy CRON_SECRET
# dual-accept. Same secret this job already sends to /walk.
#
# STATED DEPENDENCY (a real coupling, not a footnote): wiring this makes those
# cases depend on a DEPLOYED, REACHABLE app at PIPELINE_RUN_WEBHOOK_URL. If the
# Vercel staging deployment is down, unreachable, or rejects the bearer, the
# rollup never lands and the same cases fail again for an entirely unrelated
# reason. Emission is best-effort, so the sidecar will NOT fail the walk — the
# only symptom is a missing row. The two guard steps below exist precisely to
# make that mode loud instead of silent: one asserts the value reached the
# container and points at the same host as NEXT_PUBLIC_APP_URL, the other
# surfaces flow.py's webhook error lines after the walk.
#
# VALUE CORRECTNESS: the URL MUST address the app backed by the SAME Supabase
# project this lane's Vitest layer queries (vars.SUPABASE_URL = Platform
# staging). A URL pointing at the production app would land the rollup in the
# PRODUCTION `pipeline_runs` table — the cases would still fail while looking
# correctly wired. The secret's value cannot be read from the workflow (masked),
# so the guard step below compares it against vars.NEXT_PUBLIC_APP_URL, which is
# the staging app, and warns on a mismatch WITHOUT printing either value.
#
# The expected Staging value, per id-127 AMENDMENT-staging-prod-two-server.md
# OQ-3 (as corrected at S415) and deploy/coolify/.env.staging.example:50, is
#   <NEXT_PUBLIC_APP_URL>/api/internal/pipeline-runs/record?x-vercel-protection-bypass=<token>
# The query param is NOT optional, and this is EMPIRICALLY CONFIRMED, not
# inferred: an unauthenticated POST to that route returns HTTP 401 with
# `{"protection":{"password_enabled":false,"vercel_auth_enabled":true,...},
# "error":{"message":"Protected deployment"}}` — Vercel's edge, not the route.
# flow.py sends only Authorization + Content-Type, so it cannot supply the
# bypass as a header; the token must live in the URL. A correctly-hosted URL
# missing the token therefore never reaches `verifyPipelineTriggerAuth` at all,
# and no row lands. The host-match check below CANNOT detect this — the query
# string sits after the path prefix it matches on — so the post-walk step is
# the only guard for it.
#
# The tail belongs IN the secret's value, matching both deployed workers (the
# `ca-pipeline-platform-staging` and `-production` Coolify apps both carry it
# inside their own URL string). CONSIDERED AND REJECTED: minting a separate
# `VERCEL_AUTOMATION_BYPASS_SECRET` and composing the URL here. It reads like
# it would make the token independently rotatable, but it does not — the two
# Coolify URL strings would still need editing on a rotation, so it saves
# nothing operationally, while making CI the only surface whose value shape
# differs from the deployed ones. Do not re-litigate.
#
# Workflow-injection mitigation: all github context + secret values arrive via
# the job-level `env:` block, never inline ${{ }} in run: steps (mirrors
# eval-nightly.yml / integration-nightly.yml / onprem-deploy.yml).
#
# ID-128.3 walk-deadline calibration (this pass): live run 29126187575's
# sidecar log showed the FIRST `/walk` request lost the {138.9} writer-fence
# race almost immediately ("pull-sync fence busy — pass skipped, no walk
# ran", ~1s after the POST) — another writer held the lease on the SHARED
# Staging Supabase project at that instant. The trigger step then sat idle
# for the rest of its 900s budget waiting on log lines (`/walk completed` /
# `update_blocking failed`) that could never appear for a request whose pass
# had already been skipped — server.py's own docstring anticipates exactly
# this ("A later /walk signal can retry"), so the trigger step below now
# re-POSTs `/walk` (fresh requestId) whenever it observes a fence-busy skip
# for its current requestId, instead of waiting on a dead request. The
# overall completion deadline is also raised 900s -> 1800s (owner-ratified)
# as a safety net for a genuinely slow cold-docling walk once the fence is
# actually acquired. The fixture corpus (docs/testing/test-data, ~1.5MB / 8
# files) is already minimal — trimming it further would not address the
# fence-busy failure mode observed, so it is left as-is this pass.
#
# LLM TIER (id-389): the lane defaults to the tier-1 MOCK — a second container
# from the SAME just-built image running scripts/cocoindex_pipeline/mock_llm.py,
# reached by pointing the sidecar's ANTHROPIC_BASE_URL at it (the pinned
# anthropic SDK honours that env var natively; extraction.py never hardcodes
# base_url — verified 2026-07-27). Canned schema-valid extraction = the full
# wiring path (rows land, statuses flow, webhook fires, fence held) at $0 and
# with NO live Anthropic key. `workflow_dispatch` input `llm_tier: anthropic`
# opts one run into the real key for final parity BEFORE promoting a fix —
# never the scheduled default. The credential-preflight step below hard-fails
# a real-key run at minute 1 when the key is dead/disabled (the S501 lane once
# burned 75 min discovering exactly that), instead of after the build + walk.
#
# `llm_tier: openrouter` = REAL Claude extraction billed via OpenRouter
# credits (the id-387 producer regime's endpoint), for extraction-QUALITY
# runs while the direct Anthropic key stays disabled. Mechanics are the
# probe-proven {132.35} slice C/E recipe from producer/agent_loop.py:
# ANTHROPIC_BASE_URL=https://openrouter.ai/api (the Anthropic-skin
# /v1/messages endpoint), auth as a BEARER via ANTHROPIC_AUTH_TOKEN
# (= secrets.PRODUCER_AUTH_TOKEN), and ANTHROPIC_API_KEY forced EMPTY in the
# sidecar — a non-empty Anthropic-shaped X-Api-Key silently pins OpenRouter's
# provider routing AND would transmit the real Anthropic key to a third
# party (the slice E double rationale). extraction.py's model stays the
# ANTHROPIC_MODEL constant, which OpenRouter's skin routes to the anthropic
# provider — so this tier is real-model quality, not the cheap-model
# variant; a cheap-model tier needs an extraction model-override knob, which
# is a DR-060 memo-invalidation surface deliberately NOT smuggled in here.
#
# Spec: S403-coverage-audit.md gap (2) HIGH.

name: Cocoindex nightly

on:
  schedule:
    # Daily at 06:00 UTC — staggered after supabase-advisors (02:00),
    # eval-nightly/staging-reference-refresh (03:00), e2e-nightly (04:00), and
    # integration-nightly (05:00) to avoid contention on the shared CI
    # Supabase project (this lane writes to the SAME Staging project).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      llm_tier:
        description:
          "LLM tier (id-389): mock = $0 canned extraction (default); openrouter
          = real Claude via OpenRouter credits (quality runs); anthropic =
          direct key, one-run final parity only"
        type: choice
        options:
          - mock
          - openrouter
          - anthropic
        default: mock

concurrency:
  # Shares no group with the other nightly lanes (different write surface —
  # cocoindex-owned tables under test-fixture-prefixed rows) but still queues
  # against itself so a manual dispatch never clobbers an in-flight scheduled
  # run.
  group: cocoindex-nightly
  cancel-in-progress: false

jobs:
  cocoindex:
    name: Cocoindex nightly — sidecar + fixture corpus (ID-128.3, folds bl-341)
    runs-on: ubuntu-latest
    # Staging-scoped: this lane writes into the Staging Supabase project
    # (test-fixture-prefixed rows, cleaned up by the test layer's
    # dropFixture/dropFormFixture). Case-sensitive — must exactly match
    # `Staging` (docs/runbooks/github-environments.md §2).
    environment: Staging
    # Generous: cold buildpacks build (~9min, no cross-run cache — see header)
    # + stage/walk + up to ~76 sequential (fileParallelism: false) Vitest
    # cases, several of which poll up to 120s for a row to land.
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PIPELINE_TRIGGER_SECRET: ${{secrets.PIPELINE_TRIGGER_SECRET}}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
      AI_EMBEDDING_MODEL: ${{ vars.AI_EMBEDDING_MODEL }}
      AI_EMBEDDING_DIMS: ${{ vars.AI_EMBEDDING_DIMS }}
      TEST_USER_1_EMAIL: ${{ vars.TEST_USER_1_EMAIL }}
      TEST_USER_1_PASSWORD: ${{ secrets.TEST_USER_1_PASSWORD }}
      TEST_USER_2_EMAIL: ${{ vars.TEST_USER_2_EMAIL }}
      TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
      TEST_USER_3_EMAIL: ${{ vars.TEST_USER_3_EMAIL }}
      TEST_USER_3_PASSWORD: ${{ secrets.TEST_USER_3_PASSWORD }}
      # The sidecar's OWN Postgres write target — see the Postgres section of
      # the header comment. Sources the SAME Staging pooler DSN
      # api-view-coverage.yml / schema-parity.yml already use as
      # STAGING_SUPABASE_DB_URL — no separately-minted COCOINDEX_DB_DSN
      # secret (operator OQ ratified, S455 pickup).
      COCOINDEX_DB_DSN: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      # The ONLY path by which a `pipeline_runs` row can exist for this walk —
      # see the round-trip block in the header. Paired with the
      # PIPELINE_TRIGGER_SECRET bearer already declared above; both are read by
      # `_emit_pipeline_run_webhook` in flow.py and BOTH must be non-empty or
      # the emission is silently skipped.
      PIPELINE_RUN_WEBHOOK_URL: ${{ secrets.PIPELINE_RUN_WEBHOOK_URL }}
      # Sidecar container + Vitest wiring (this job's local topology, not
      # secrets — literal here is fine).
      COCOINDEX_IMAGE_TAG: "kh-cocoindex-pipeline:nightly-${{ github.run_id }}"
      COCOINDEX_PORT: "8080"
      COCOINDEX_APP_DIR: "/workspace"
      COCOINDEX_CONTAINER_SOURCE_PATH: "/cocoindex-state/corpus"
      # LLM tier (id-389) — `mock` on every scheduled run (inputs is empty on
      # schedule, so the fallback applies); a dispatcher opts into `anthropic`
      # explicitly. Arrives via env per the workflow-injection rule above, and
      # the choice input constrains the value set.
      LLM_TIER: ${{ inputs.llm_tier || 'mock' }}
      MOCK_LLM_PORT: "8090"
      # Client-org knob for holder derivation (holder_rule.py R4 fail-fast) —
      # unset it costs ~1,080 holder_derivation_failed warnings per run
      # (graceful degrade, S507). The fixture corpus is the platform's own
      # default-branding corpus, so the platform organisationName is the
      # correct self-vs-supplier anchor (S508 owner call).
      PIPELINE_CLIENT_ORG: ${{ vars.PIPELINE_CLIENT_ORG }}
      # OpenRouter Bearer for the `openrouter` tier (id-389 tier-2) — the
      # same credential the deployed producer uses (id-387 regime map).
      PRODUCER_AUTH_TOKEN: ${{ secrets.PRODUCER_AUTH_TOKEN }}
      OPENROUTER_ANTHROPIC_BASE_URL: "https://openrouter.ai/api"

    steps:
      - name:
          Credential preflight — hard-fail at minute 1, before any spend
          (id-389)
        # One cheap /v1/messages ping against the REAL endpoint whenever a
        # live credential is in play. A dead/disabled key fails HERE — not 75
        # minutes later after the buildpacks build and a fence-gated walk
        # (the S501 failure mode this step exists to kill). The mock tier has
        # no live credential; its own /health gate below is its preflight.
        run: |
          set -euo pipefail
          case "$LLM_TIER" in
            anthropic)
              PREFLIGHT_URL="https://api.anthropic.com/v1/messages"
              AUTH_ARGS=(-H "x-api-key: ${ANTHROPIC_API_KEY}")
              ;;
            openrouter)
              # Bearer auth, NEVER x-api-key: an Anthropic-shaped X-Api-Key
              # pins OpenRouter's provider routing (producer slice E).
              PREFLIGHT_URL="${OPENROUTER_ANTHROPIC_BASE_URL}/v1/messages"
              AUTH_ARGS=(-H "Authorization: Bearer ${PRODUCER_AUTH_TOKEN}")
              if [ -z "$PRODUCER_AUTH_TOKEN" ]; then
                echo "llm_tier=openrouter but secrets.PRODUCER_AUTH_TOKEN is empty/unprovisioned — failing at minute 1." >&2
                exit 1
              fi
              ;;
            *)
              echo "LLM tier '${LLM_TIER}': no live credential in play — preflight not applicable (mock /health gate covers the mock tier)."
              exit 0
              ;;
          esac
          HTTP_CODE=$(curl -s -o /tmp/preflight-body.json -w "%{http_code}" -m 20 \
            -X POST "$PREFLIGHT_URL" \
            "${AUTH_ARGS[@]}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}' \
            || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Credential preflight FAILED for tier '${LLM_TIER}' (HTTP ${HTTP_CODE}) — the credential is dead, disabled, or unreachable. Failing at minute 1 instead of after the walk. Response body:" >&2
            cat /tmp/preflight-body.json >&2 || true
            exit 1
          fi
          echo "Credential preflight OK for tier '${LLM_TIER}' (HTTP 200)."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # id-400 (HARNESS §1 step 1 — D1 pre-run sweep, NM-6 asserted).
      # Deletes ONLY fixture-prefixed rows (VERIFY-* + the declared per-test
      # dest/filename prefix families) so the lane starts from a known
      # fixture population and census run-over-run deltas are signal
      # (HARNESS §4). The script's NM-6 scope guard re-verifies every
      # candidate row against the declared manifest BEFORE any delete and
      # FAILS THE RUN on a single mismatch — showcase/platform content is
      # never sweep-eligible (S511 D1 owner amendment). Runs before the
      # ~9-min image build (a sweep failure must not burn the build) and
      # before the sidecar exists (cannot race a walk). pipeline_runs is
      # never touched (telemetry accumulates by design).
      - name: Pre-run sweep (fixture-prefixed rows only — D1/NM-6)
        env:
          ALLOW_COCOINDEX_NIGHTLY_SWEEP: "1"
          # Fail-closed target allowlist (PR #156 review): the sweep script
          # REFUSES to run unless SUPABASE_URL contains this expected ref.
          # PLATFORM_PROJECT_REF is the Platform staging project (non-secret
          # value; stored as a repo secret per the existing ci.yml /
          # supabase-advisors.yml convention) — the same project
          # vars.SUPABASE_URL points at.
          KH_SWEEP_EXPECTED_PROJECT_REF: ${{ secrets.PLATFORM_PROJECT_REF }}
        run: bun run scripts/cocoindex-nightly-sweep.ts

      - name: Setup the Cloud Native Buildpacks `pack` CLI
        uses: buildpacks/github-actions/setup-pack@8fe5c9d7f5a3fa22d4b7cc7d50ba8ebd7eddf414 # v5.12.3 (pinned, matches onprem-deploy.yml)

      - name: Build cocoindex sidecar image (local — no publish, see header)
        # Pruned context mirrors onprem-deploy.yml's IMAGE HYGIENE step
        # exactly: scripts/ + requirements.lock (renamed requirements.txt,
        # the LOCKED transitive closure, {127.22}/S438).
        #
        # WHAT THE IMAGE ACTUALLY CARRIES (F2, corrected S524 — the previous
        # sentence claimed "nothing else, so the image never carries the
        # Next.js app / docs / .claude / tests"). The first half is true: no
        # Next.js app, no docs, no .claude. The TESTS clause is false and has
        # been since the fixtures moved under scripts/. The context is
        # `cp -R scripts` — the WHOLE tree, with no .gcloudignore /
        # project.toml / .slugignore narrowing it — so the image ships
        # scripts/tests/ in full. Measured on a real build of this exact
        # context: 87 test_*.py, 209 files, 9.2 MB under scripts/tests, in a
        # 16 MB app dir. (The task file said "99 Python test files"; the
        # measured figure is 87 test_*.py / 89 .py.)
        #
        # The comment is corrected rather than the context narrowed, on an
        # owner ruling (S524). Narrowing is an image-SHAPE change to the live
        # deploy path (platform staging + prod + the client boxes all pull
        # this image, and bid-worker-platform runs it via a command: override),
        # and it interacts with F1 below: narrowing would make the form-fixture
        # docker cp NECESSARY again, so the two cannot be decided in sequence.
        # id-416 rewrites the build context wholesale for the Dockerfile move;
        # "should the test suite ship in the sidecar image?" is settled there,
        # once, with both halves in view.
        #
        # No --publish / --cache-image (registry-backed, not needed here —
        # see header) — `pack build` without --publish loads straight into
        # this runner's local Docker daemon for the `docker run` step below.
        run: |
          set -euo pipefail
          CTX="$(mktemp -d)"
          cp -R scripts "${CTX}/scripts"
          cp requirements.lock "${CTX}/requirements.txt"
          echo "Pruned build context:"; ls -A "${CTX}"
          pack build "${COCOINDEX_IMAGE_TAG}" \
            --path "${CTX}" \
            --builder gcr.io/buildpacks/builder:google-22 \
            --env "GOOGLE_ENTRYPOINT=python3 -m scripts.cocoindex_pipeline.server" \
            --env "GOOGLE_RUNTIME=python" \
            --env "GOOGLE_PYTHON_VERSION=3.13.13"
          echo "Built ${COCOINDEX_IMAGE_TAG} (local daemon only, not pushed)"

          # POST-`pack` LAYER — byte-for-byte the same two RUN instructions
          # onprem-deploy.yml applies to the image it publishes. The full
          # rationale for BOTH lives there; do not let the two drift.
          #
          # S524 (id-412 recipe parity): until this session the lane stopped at
          # bare `pack build`, while onprem-deploy.yml pulled its published
          # image back and re-published it through an apt layer baking `git`,
          # `openssh-client`, `libreoffice-writer` and `libreoffice-calc`. The
          # nightly was therefore exercising an image missing FOUR packages the
          # deployed one carries — a lane whose entire purpose is dogfooding the
          # deployed artefact, testing something else. LibreOffice in particular
          # is not incidental: `soffice` is the DR-059 / ID-145 {145.31}
          # convert-on-upload bridge for legacy `.doc` / `.xls`, so its absence
          # here silently hid that whole path from the lane.
          #
          # THIS IS A DUPLICATE AND THAT IS THE INTERIM STATE, NOT THE TARGET.
          # Two copies of a recipe drift — this lane is the proof, and the
          # duplication is deliberate only because unifying it properly means
          # touching the live deploy path. The target is one shared build
          # (composite action or reusable workflow) called by both, with the
          # nightly PULLING the published image whenever a matching tag exists
          # and building only as a branch-dispatch fallback. Owner-approved
          # S524; owned by id-416 alongside the buildpacks -> Dockerfile move,
          # which retires this heredoc entirely. Until then: any edit to either
          # copy MUST be made to both, in the same commit.
          ORIG_USER="$(docker inspect --format '{{.Config.User}}' "${COCOINDEX_IMAGE_TAG}")"
          WORKDIR="$(mktemp -d)"
          cat > "${WORKDIR}/Dockerfile" <<DOCKERFILE
          FROM ${COCOINDEX_IMAGE_TAG}
          USER root
          RUN apt-get update && apt-get install -y --no-install-recommends git openssh-client libreoffice-writer libreoffice-calc && rm -rf /var/lib/apt/lists/* && soffice --headless --version && ssh -V
          USER ${ORIG_USER:-cnb}
          RUN PY="\$(ls -d /layers/*/*/bin/python3 2>/dev/null | head -1)" && SP="\$(ls -d /layers/google.python.pip/pip/lib/python*/site-packages 2>/dev/null | head -1)" && test -n "\$PY" && test -n "\$SP" && rm -rf "\$SP"/cv2 "\$SP"/opencv_python-*.dist-info "\$SP"/opencv_python_headless-*.dist-info "\$SP"/opencv_python.libs "\$SP"/opencv_python_headless.libs && "\$PY" -m pip install --force-reinstall --no-deps --target "\$SP" opencv-python-headless==4.13.0.92 && PYTHONPATH="\$SP" "\$PY" -c "import cv2, importlib.metadata as md; names = {d.metadata['Name'] for d in md.distributions()}; assert 'opencv-python' not in names, sorted(n for n in names if n and 'opencv' in n); print('ID-413 cv2 OK (headless only):', cv2.__file__)"
          DOCKERFILE
          docker build -t "${COCOINDEX_IMAGE_TAG}" "${WORKDIR}"
          echo "Applied the post-pack layer to ${COCOINDEX_IMAGE_TAG}: git + openssh-client + LibreOffice (soffice) + ID-413 opencv-headless — same two RUNs as onprem-deploy.yml."

      - name: Prepare host-side corpus bind-mount dir
        # The bind-mount source dir on the RUNNER — the handful of tests that
        # write directly against COCOINDEX_SOURCE_PATH (not via the /stage
        # HTTP route) need a HOST-visible path; the container sees the SAME
        # underlying files at COCOINDEX_CONTAINER_SOURCE_PATH via the bind
        # mount below.
        run: |
          set -euo pipefail
          # Mount the STATE PARENT (mirrors the Coolify composes' single
          # /cocoindex-state volume): corpus/ is the walk source dir and
          # lmdb/ is the cocoindex engine's internal state store
          # (COCOINDEX_DB — run 29125667405 crashed the background thread
          # without it). World-writable: the buildpack image runs as a
          # non-root user (cnb) which must write the {62.6} manifest seed
          # into corpus/ at boot (run 29125080389 EACCESed) and the LMDB
          # env under lmdb/. Throwaway single-tenant CI dir, so 0777 is
          # acceptable.
          mkdir -p "${RUNNER_TEMP}/cocoindex-state/corpus" "${RUNNER_TEMP}/cocoindex-state/lmdb"
          chmod -R 0777 "${RUNNER_TEMP}/cocoindex-state"
          echo "COCOINDEX_HOST_STATE_PATH=${RUNNER_TEMP}/cocoindex-state" >> "$GITHUB_ENV"
          echo "COCOINDEX_HOST_SOURCE_PATH=${RUNNER_TEMP}/cocoindex-state/corpus" >> "$GITHUB_ENV"

      - name:
          Seed the WALKED BASELINE — the vendored Platform corpus (id-412 W3)
        # ─────────────────────────────────────────────────────────────────────
        # THE WALKED BASELINE. Everything ingested by the `/walk` below that is
        # not explicitly staged by a test comes from here, and here is the
        # vendored synthetic Platform corpus:
        #
        #     scripts/cocoindex_pipeline/fixtures/platform-corpus/
        #
        # Until S524 this lane seeded NOTHING as its baseline. It `docker cp`d
        # form-extraction fixtures into the app dir as source bytes for
        # verify_driver, and walked only what individual tests happened to
        # stage — so "the walked corpus" and "the Platform corpus" had never
        # once been the same thing, in a lane whose stated purpose is to
        # dogfood the Platform E2E path. Owner ruling S522: the corpus was not
        # in the wrong directory, it was THE WRONG CORPUS.
        #
        # MECHANISM — the established one, invoked, not re-implemented (AC-1).
        # deploy/onprem/sync-platform-corpus.sh (ID-134 {134.4}) is the
        # ratified vendored -> deployed bridge and it is CALLED here rather
        # than copied, so this lane cannot drift from the on-prem path the way
        # it drifted from onprem-deploy.yml's image recipe.
        #
        # Its two hops map onto this topology exactly, which is why no third
        # mechanism is needed:
        #
        #   Hop A  vendored tree -> derived copy at --dest.
        #          --dest is a documented flag; we point it straight at the
        #          bind-mount source dir. rsync --archive --delete makes the
        #          dest byte-exact, with .DS_Store EXCLUDED, then the script's
        #          own `diff -r` self-check fails loud if the copy is not
        #          identical.
        #
        #          That exclusion was ADDED at S524 and is not cosmetic. The
        #          script's own comment claimed --delete already "pruned" stray
        #          .DS_Store placeholders; a measured run disproved it — --delete
        #          removes files present in DEST and absent from SRC, so a
        #          .DS_Store sitting IN the vendored tree (untracked, and exactly
        #          what Finder leaves on an operator's checkout) was copied into
        #          the corpus and would be walked as a document. Latent here (a
        #          CI clone has none) and live on the deploy host, where this
        #          same script is the production corpus bridge.
        #
        #   Hop B  derived copy -> the container's /cocoindex-state/corpus.
        #          On-prem this is a `docker cp` onto a named volume. HERE THE
        #          BIND MOUNT IS HOP B: `-v ${COCOINDEX_HOST_STATE_PATH}:/cocoindex-state`
        #          below means the container reads these very bytes at
        #          COCOINDEX_CONTAINER_SOURCE_PATH. Copying them in again would
        #          be the bespoke third mechanism AC-1 forbids.
        #
        # WALKED BASELINE vs STAGED PER TEST — the distinction AC-2 requires be
        # explicit rather than implied by step ordering:
        #   * THIS step, before the container starts, populates the baseline.
        #     Content documents. Ingested by the supervised /walk.
        #   * The "Stage fixture set" step and each test's own stageFixture()
        #     call add per-test inputs ON DEMAND, via the /stage HTTP route,
        #     after boot. Form templates belong ONLY there.
        # A file placed here is corpus. A file staged there is a test input.
        # They are not interchangeable and the tests that confused them are
        # id-415's work list.
        run: |
          set -euo pipefail
          deploy/onprem/sync-platform-corpus.sh --dest "${RUNNER_TEMP}/cocoindex-state/corpus"
          # 0777 again: the sync ran as the runner user, but the sidecar runs
          # as cnb and writes the {62.6} manifest seed into this dir at boot.
          chmod -R 0777 "${RUNNER_TEMP}/cocoindex-state/corpus"
          echo "Walked baseline seeded from the vendored Platform corpus:"
          find "${RUNNER_TEMP}/cocoindex-state/corpus" -type f | sed "s|${RUNNER_TEMP}/cocoindex-state/corpus/|  |" | sort
          # Assert a non-empty baseline rather than trusting the copy. A silent
          # zero here would reproduce the exact defect this step exists to fix,
          # and it would look like a green lane.
          SEEDED="$(find "${RUNNER_TEMP}/cocoindex-state/corpus" -type f | wc -l | tr -d ' ')"
          echo "walked-baseline file count: ${SEEDED}"
          if [ "${SEEDED}" -lt 1 ]; then
            echo "::error::the walked baseline is EMPTY — the Platform corpus did not reach ${RUNNER_TEMP}/cocoindex-state/corpus" >&2
            exit 1
          fi

      - name: Start mock LLM container (id-389 tier-1 — the default tier)
        # SAME just-built image, second container, running mock_llm.py via the
        # /cnb/lifecycle/launcher entrypoint override (the buildpack ENTRYPOINT
        # pins the `web` process and never execs a command — the CNB gotcha the
        # Coolify bid-worker service documents). Health-gated before the
        # sidecar starts so a broken mock fails fast, not as a walk timeout.
        # The user-defined network gives the sidecar `mock-llm` DNS.
        if: env.LLM_TIER == 'mock'
        run: |
          set -euo pipefail
          docker network create coco-nightly 2>/dev/null || true
          docker run -d --name mock-llm \
            --network coco-nightly \
            -p "${MOCK_LLM_PORT}:${MOCK_LLM_PORT}" \
            -e "PORT=${MOCK_LLM_PORT}" \
            --entrypoint /cnb/lifecycle/launcher \
            "${COCOINDEX_IMAGE_TAG}" \
            python3 -m scripts.cocoindex_pipeline.mock_llm
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 5 \
              "http://localhost:${MOCK_LLM_PORT}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "mock-llm healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "mock-llm failed to become healthy within 30s (last HTTP code: ${HTTP_CODE})" >&2
          docker logs mock-llm >&2 || true
          exit 1

      - name: Run cocoindex sidecar container
        # Publishes the sidecar port to the host (unlike the B1 Coolify
        # deployment, which publishes no host port) — a GH Actions runner is
        # single-tenant for this job, so a direct host curl/fetch against
        # localhost:8080 is simplest for both the health probe and the
        # Vitest run below.
        #
        # IMAGE_SHA (Inv-8 forensic key): flow.py reads os.environ["IMAGE_SHA"]
        # and threads it to the pipeline-run webhook as `extractorVersion`,
        # which the record route lands as `result.extractor_version`. The
        # Coolify composes pass it (docker-compose.platform.yaml ~L170); this
        # lane must too, or every nightly-produced pipeline_runs row lacks
        # extractor identification and extractor-version-cross-ref hard-fails
        # ("expected 0 > 0" — the S507 root cause; the S506 webhook fix is
        # what EXPOSED it, since orphan op_ids previously skipped cleanly).
        # The local nightly tag (kh-cocoindex-pipeline:nightly-<run_id>)
        # identifies the exact build, same contract as the compose tag.
        #
        # id-389: on the mock tier the sidecar joins the mock's network and
        # gets ANTHROPIC_BASE_URL pointed at it — extraction's zero-arg
        # AsyncAnthropic() picks the var up natively. On the anthropic tier
        # the var is simply absent (an empty value would BREAK the SDK:
        # base_url='' beats its default — never pass it blank). On the
        # openrouter tier the base URL is the Anthropic-skin endpoint, auth
        # is the Bearer ANTHROPIC_AUTH_TOKEN, and ANTHROPIC_API_KEY is
        # forced EMPTY (provider-pinning defeat + never send the Anthropic
        # key to a third party — producer slice E, probe-proven).
        run: |
          set -euo pipefail
          docker network create coco-nightly 2>/dev/null || true
          EXTRA_LLM_ARGS=()
          SIDECAR_ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}"
          case "$LLM_TIER" in
            mock)
              EXTRA_LLM_ARGS+=(-e "ANTHROPIC_BASE_URL=http://mock-llm:${MOCK_LLM_PORT}")
              ;;
            openrouter)
              EXTRA_LLM_ARGS+=(-e "ANTHROPIC_BASE_URL=${OPENROUTER_ANTHROPIC_BASE_URL}")
              EXTRA_LLM_ARGS+=(-e "ANTHROPIC_AUTH_TOKEN=${PRODUCER_AUTH_TOKEN}")
              SIDECAR_ANTHROPIC_API_KEY=""
              ;;
          esac
          docker run -d --name cocoindex-sidecar \
            --network coco-nightly \
            -p "${COCOINDEX_PORT}:${COCOINDEX_PORT}" \
            "${EXTRA_LLM_ARGS[@]}" \
            -e "PORT=${COCOINDEX_PORT}" \
            -e "IMAGE_SHA=${COCOINDEX_IMAGE_TAG}" \
            -e "COCOINDEX_SOURCE_PATH=${COCOINDEX_CONTAINER_SOURCE_PATH}" \
            -e "COCOINDEX_DB=/cocoindex-state/lmdb" \
            -e "COCOINDEX_DB_DSN=${COCOINDEX_DB_DSN}" \
            -e "SUPABASE_URL=${SUPABASE_URL}" \
            -e "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}" \
            -e "ANTHROPIC_API_KEY=${SIDECAR_ANTHROPIC_API_KEY}" \
            -e "OPENAI_API_KEY=${OPENAI_API_KEY}" \
            -e "CRON_SECRET=${CRON_SECRET}" \
            -e "PIPELINE_TRIGGER_SECRET=${PIPELINE_TRIGGER_SECRET}" \
            -e "PIPELINE_RUN_WEBHOOK_URL=${PIPELINE_RUN_WEBHOOK_URL}" \
            -e "PIPELINE_CLIENT_ORG=${PIPELINE_CLIENT_ORG}" \
            -v "${COCOINDEX_HOST_STATE_PATH}:/cocoindex-state" \
            "${COCOINDEX_IMAGE_TAG}"

      - name: Health-check the sidecar (GET /health)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 5 \
              "http://localhost:${COCOINDEX_PORT}/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Sidecar healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Sidecar failed to become healthy within 30s (last HTTP code: ${HTTP_CODE})" >&2
              docker logs cocoindex-sidecar >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Confirm the pipeline-run webhook config reached the sidecar
        # Mirrors the `/extract` seam preflight in e2e-nightly.yml (f96b0457),
        # for the same defect class: an unset secret resolves to the EMPTY
        # STRING, not an error, and flow.py's emission is best-effort — so
        # without this the ONLY symptom of a missing or misdirected URL is a
        # `pipeline_runs` row that never lands and a cluster of opaque polling
        # timeouts (run 30272898165).
        #
        # Prints PRESENCE and a host-match verdict ONLY — never either value.
        # PIPELINE_RUN_WEBHOOK_URL is a secret (masked in logs anyway); what
        # matters is that it addresses the SAME app as NEXT_PUBLIC_APP_URL,
        # because that app decides which Supabase project `recordPipelineRun`
        # writes into, and the Vitest tier below asserts against
        # vars.SUPABASE_URL.
        #
        # Warn, do not fail, on the two conditions the owner controls (secret
        # unset / pointed elsewhere): the walk is unaffected and the ~60 cases
        # that never read `pipeline_runs` must still run. HARD-fail only the
        # one condition this file owns — value present on the runner but not
        # inside the container, i.e. a broken `docker run -e` list.
        run: |
          set -euo pipefail
          if [ -z "${PIPELINE_RUN_WEBHOOK_URL:-}" ]; then
            echo "::warning::PIPELINE_RUN_WEBHOOK_URL is unset in the Staging environment — flow.py will silently skip the pipeline-run webhook, no pipeline_runs row will land, and every case polling for one will time out. Add the secret to the Staging GitHub environment."
            exit 0
          fi
          # Probe by OUTPUT, not by exit status: a non-zero `docker exec` means
          # "could not probe" (no `sh` on the buildpack image's exec PATH,
          # container already gone) — NOT "variable absent". Conflating the two
          # would red the whole lane for a diagnostic that failed to run.
          if PRESENCE="$(docker exec cocoindex-sidecar sh -c 'printf %s "${PIPELINE_RUN_WEBHOOK_URL:+present}"' 2>/dev/null)"; then
            if [ "$PRESENCE" != "present" ]; then
              echo "PIPELINE_RUN_WEBHOOK_URL is set on the runner but did NOT reach the sidecar container — check the 'docker run -e' list above." >&2
              exit 1
            fi
            echo "PIPELINE_RUN_WEBHOOK_URL present on the runner AND inside the sidecar container."
          else
            echo "::warning::Could not probe the sidecar container for PIPELINE_RUN_WEBHOOK_URL (docker exec failed) — runner-side presence confirmed, container-side unverified."
          fi
          APP_URL="${NEXT_PUBLIC_APP_URL%/}"
          case "${PIPELINE_RUN_WEBHOOK_URL}" in
            "${APP_URL}"/*)
              echo "Webhook target matches NEXT_PUBLIC_APP_URL (${APP_URL}) — the rollup is recorded by the app backed by the same Supabase project this lane asserts against."
              ;;
            *)
              echo "::warning::PIPELINE_RUN_WEBHOOK_URL does NOT begin with NEXT_PUBLIC_APP_URL (${APP_URL}). The rollup will be recorded by a DIFFERENT app deployment, which may write pipeline_runs into a DIFFERENT Supabase project than the one this lane queries — the cases would fail while looking correctly wired. Expected: ${APP_URL}/api/internal/pipeline-runs/record"
              ;;
          esac
          # The prefix check above CANNOT see this: a bare, tail-less URL has
          # the correct prefix and passes it, then 401s at Vercel's edge — the
          # guard would run, pass, and miss the exact defect it was added for.
          # That is the id-379 "signal too weak to see the failure" shape, so
          # assert the tail as its own condition. Warn rather than fail, per
          # the step's rule above: the secret's value is the owner's to fix,
          # and one spec cluster's dependency must not red the other ~60 cases.
          case "${PIPELINE_RUN_WEBHOOK_URL}" in
            *"x-vercel-protection-bypass="*)
              echo "Bypass token present in the URL — the POST can clear Vercel Deployment Protection and reach the route."
              ;;
            *)
              echo "::warning::PIPELINE_RUN_WEBHOOK_URL carries NO ?x-vercel-protection-bypass=<token> query param. The Platform-staging Vercel deployment has Deployment Protection ON, and flow.py sends only Authorization + Content-Type — so every rollup POST will be rejected at Vercel's edge with 'Protected deployment' WITHOUT reaching verifyPipelineTriggerAuth, no pipeline_runs row will land, and the cases polling for one will time out. Append the tail to the Staging secret, matching what the ca-pipeline-platform-staging Coolify app already carries. (If Deployment Protection is ever turned off for this app, this warning becomes noise and should be removed with it.)"
              ;;
          esac

      # ─────────────────────────────────────────────────────────────────────
      # DELETED S524 (id-412, F1): "Seed fixture corpus into the container
      # (docker cp)". It copied the form-extraction fixtures into the app dir
      # so verify_driver could read them, on the premise — stated in its own
      # comment — that "the buildpack image ships ONLY scripts/ +
      # requirements.txt". That premise stopped being a reason the moment the
      # fixtures moved under scripts/: they are now IN scripts/, the build
      # context is `cp -R scripts` (the whole tree), so they ship in the image
      # already, at the very path the step copied them to.
      #
      # Verified against a real image, not inferred — the AC required exactly
      # that, and the probe images left over from id-413 turned out to be
      # minimal reproductions rather than the pipeline image, so they proved
      # nothing. A `pack build` of this workflow's own pruned context
      # (scripts/ + requirements.lock as requirements.txt, same builder) gives:
      #
      #   /workspace                     <- CNB app dir == COCOINDEX_APP_DIR
      #   /workspace/scripts/cocoindex_pipeline/fixtures/form-templates/
      #                                  <- all 10 templates, present
      #   /workspace/scripts/cocoindex_pipeline/fixtures/platform-corpus/
      #                                  <- all 11 corpus files, present
      #
      # The step was copying files that were already there, to where they
      # already were. The step's comment also still named docs/testing — a
      # tree deleted three commits before the step was last touched.
      #
      # NOTE for id-416: this deletion is coupled to the F2 build-context
      # decision. If the context is ever narrowed to exclude scripts/tests/
      # (or narrowed at all in a way that drops the fixtures), THIS STEP MUST
      # COME BACK. The same measurement shows the image currently carries 87
      # test_*.py files / 209 files / 9.2 MB under scripts/tests — which is
      # what F2's comment now describes honestly instead of denying.
      # ─────────────────────────────────────────────────────────────────────

      - name: Stage fixture set (verify_driver, loopback POST /stage)
        # A non-zero driver exit fails HERE, before /walk and before Vitest
        # (ID-62 {62.9}). The buildpack image's exec PATH omits the buildpack
        # layers (a bare `python3` 127s), so every docker exec below injects
        # PYTHONUSERBASE + PATH explicitly. id-416 retires this env block with
        # the Dockerfile move (DR-119) — it is a CNB artefact, not a
        # requirement.
        run: |
          set -euo pipefail
          docker exec \
            -e PYTHONUSERBASE=/layers/google.python.pip/pip \
            -e PATH=/layers/google.python.pip/pip/bin:/layers/google.python.runtime/python/bin:/usr/bin:/bin \
            cocoindex-sidecar \
            python3 -m scripts.cocoindex_pipeline.verify_driver --fixtures templates

      - name:
          Trigger corpus walk (bearer-gated POST /walk), wait for completion,
          and red on in-scope item drops (id-414 AC-3)
        # Port is published to the host, so a plain host-side curl suffices —
        # no docker-exec-python3-urllib indirection needed. (The deleted B1
        # operator hook needed that indirection because the compose stack
        # publishes no host port for the sidecar; if a live-box hook is ever
        # rewritten, that is the one topology difference it must handle.)
        #
        # ID-128.3 calibration (this pass, see header): retries on a
        # fence-busy skip instead of waiting on a dead requestId, and the
        # overall deadline is 1800s (was 900s).
        run: |
          set -euo pipefail
          WALK_OVERALL_START=$(date +%s)
          WALK_STEP_SINCE="$(date -u +%Y-%m-%dT%H:%M:%S)"
          echo "COCOINDEX_WALK_LOG_SINCE=${WALK_STEP_SINCE}" >> "$GITHUB_ENV"
          DEADLINE=$(( WALK_OVERALL_START + 1800 ))
          FENCE_RETRIES=0
          # id-382 part 3: a run whose EVERY attempt bounces off the {138.9}
          # writer-fence must report a BLOCK (with the holder + expiry the
          # sidecar logged), not burn the full 1800s and report a timeout —
          # the S501 misdiagnosis cost a full nightly + ~40 min. 300s is
          # > 2x the 120s renewal TTL (writer_fence.py), so once the id-382
          # renew migration is applied a DEAD holder's lease will have
          # expired within the window — still-busy after 300s means a live
          # holder or a pre-renewal stale lease, and either way the honest
          # verdict is "blocked", named, 25 minutes sooner. The holder +
          # expires_at detail travels in the sidecar's fence-busy log line
          # (the sidecar is the only layer with DB reach into the lease
          # table); this step just relays it into the run summary, which is
          # id-379's "loudly" bar.
          FENCE_BUSY_FAIL_FAST_SECONDS=300
          FIRST_BUSY_AT=""

          trigger_walk() {
            WALK_LOG_SINCE="$(date -u +%Y-%m-%dT%H:%M:%S)"
            WALK_RESPONSE="$(curl -s -X POST -H "Authorization: Bearer ${PIPELINE_TRIGGER_SECRET}" \
              "http://localhost:${COCOINDEX_PORT}/walk")"
            echo "walk response: ${WALK_RESPONSE}"
            REQUEST_ID="$(printf '%s' "$WALK_RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("requestId",""))' 2>/dev/null || true)"
            if [ -z "$REQUEST_ID" ]; then
              echo "no requestId in /walk response (see error above)" >&2
              exit 1
            fi
          }

          trigger_walk
          while true; do
            WALK_LINES="$(docker logs --since "$WALK_LOG_SINCE" cocoindex-sidecar 2>&1 | grep -F "requestId=${REQUEST_ID}" || true)"
            if printf '%s' "$WALK_LINES" | grep -q "/walk completed"; then
              WALK_ELAPSED=$(( $(date +%s) - WALK_OVERALL_START ))
              echo "walk completed (requestId=${REQUEST_ID}) after ${WALK_ELAPSED}s overall (fence-busy retries=${FENCE_RETRIES})"
              break
            fi
            if printf '%s' "$WALK_LINES" | grep -q "update_blocking failed"; then
              echo "walk FAILED (requestId=${REQUEST_ID}) — see docker logs" >&2
              docker logs cocoindex-sidecar >&2 || true
              exit 1
            fi
            if printf '%s' "$WALK_LINES" | grep -q "fence busy"; then
              FENCE_RETRIES=$((FENCE_RETRIES + 1))
              # The sidecar's enriched WriterFenceBusyError message carries
              # "blocked by lease held by <label>, expires <ts>" when the
              # lease row was readable (writer_fence.py, id-382 part 3).
              HOLDER_INFO="$(printf '%s' "$WALK_LINES" | grep -oE 'blocked by lease held by [^)]*' | tail -1 || true)"
              if [ -z "$FIRST_BUSY_AT" ]; then
                FIRST_BUSY_AT=$(date +%s)
              fi
              BUSY_FOR=$(( $(date +%s) - FIRST_BUSY_AT ))
              echo "walk pass skipped (requestId=${REQUEST_ID}) — writer-fence busy for ${BUSY_FOR}s (${HOLDER_INFO:-holder detail not in sidecar log}); re-issuing /walk (retry ${FENCE_RETRIES})"
              if [ "$BUSY_FOR" -ge "$FENCE_BUSY_FAIL_FAST_SECONDS" ]; then
                echo "::error::walk BLOCKED by the {138.9} writer-fence lease — ${HOLDER_INFO:-holder detail not in sidecar log (pre-id-382 sidecar image?)}. Every attempt for ${BUSY_FOR}s was fence-busy (retries=${FENCE_RETRIES}); failing FAST instead of burning the 1800s budget. This is a BLOCK, not a slow walk: if the holder is a dead/cancelled run its lease self-expires (120s renewal TTL once the id-382 renew migration is applied; 1h acquire TTL before it) — see tasks/id-382 for the read-then-judge release workaround." >&2
                exit 1
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                WALK_ELAPSED=$(( $(date +%s) - WALK_OVERALL_START ))
                echo "walk did not complete within ${WALK_ELAPSED}s (deadline 1800s, requestId=${REQUEST_ID}, fence-busy retries=${FENCE_RETRIES})" >&2
                exit 1
              fi
              sleep 5
              trigger_walk
              continue
            fi
            # Progress without a busy skip (the walk is genuinely running) —
            # reset the consecutive-busy window so only an UNBROKEN run of
            # fence-busy skips can trip the fail-fast above.
            FIRST_BUSY_AT=""
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              WALK_ELAPSED=$(( $(date +%s) - WALK_OVERALL_START ))
              echo "walk did not complete within ${WALK_ELAPSED}s (deadline 1800s, requestId=${REQUEST_ID}, fence-busy retries=${FENCE_RETRIES})" >&2
              exit 1
            fi
            sleep 10
          done

          # ── id-414 AC-3: the in-scope / out-of-scope gate ────────────────
          # Boundary rule (the W2 purpose framing), stated here because this
          # is the code that enforces its corpus half: the corpus THIS walk
          # just walked is exactly the vendored Platform corpus — the id-412
          # seed step above staged it as the walked baseline, and the
          # verify_driver step stages only Platform-corpus-derived copies
          # under verify/ (its `templates` set reads
          # scripts/cocoindex_pipeline/fixtures/platform-corpus/content/).
          # Every item in this pass is therefore IN-SCOPE by construction: a
          # per-item drop here is a real Platform-E2E regression and REDS the
          # job — the S522 class (159 drops under a green `completed`) can
          # no longer pass silently. Expected-unsupported inputs that are NOT
          # part of the Platform corpus only enter via LATER per-test
          # staging (the Vitest step): those walks are deliberately NOT
          # gated here — their drops surface as the sidecar's WARNING-level
          # `cocoindex.run_terminal` line + the webhook `item_failures`
          # count, and the job stays GREEN for them.
          #
          # Instrument: flow.py's `cocoindex.run_terminal` structured line
          # (id-414 AC-2) — emitted unconditionally at flow end, unlike the
          # webhook row (best-effort delivery to a possibly-misconfigured
          # URL; see the preflight warning step above), and readable over
          # the same docker-logs channel the wait loop above already uses.
          # An unreadable instrument FAILS the gate rather than passing
          # unverified — silent-green on missing evidence is exactly the
          # defect class this gate exists to kill.
          OP_ID="$(printf '%s' "$WALK_LINES" | grep -oE 'opId=[0-9a-f-]{36}' | tail -1 | cut -d= -f2 || true)"
          if [ -z "$OP_ID" ]; then
            echo "::error::id-414 gate: the '/walk completed' line carried no opId — the id-400 FlowRunContext attribution channel is broken, so the in-scope item-drop gate CANNOT evaluate. Failing rather than passing unverified." >&2
            exit 1
          fi
          TERMINAL_LINE="$(docker logs --since "$WALK_LOG_SINCE" cocoindex-sidecar 2>&1 | grep -F '"event": "cocoindex.run_terminal"' | grep -F "$OP_ID" | tail -1 || true)"
          if [ -z "$TERMINAL_LINE" ]; then
            echo "::error::id-414 gate: no cocoindex.run_terminal line for op_id ${OP_ID} in the sidecar log — cannot read the run's item-failure count. Failing rather than passing unverified." >&2
            exit 1
          fi
          GATE_EVAL="$(printf '%s' "$TERMINAL_LINE" | python3 -c 'import json,sys; line=sys.stdin.read(); payload=json.loads(line[line.index("{"):]); print(payload.get("status","unknown"), payload.get("item_failure_total",-1))')"
          set -- $GATE_EVAL
          RUN_STATUS="${1:-unknown}"; FAIL_TOTAL="${2:--1}"
          echo "baseline Platform-corpus walk terminal: status=${RUN_STATUS} item_failure_total=${FAIL_TOTAL} (op_id=${OP_ID})"
          if [ "$RUN_STATUS" = "completed" ] && [ "$FAIL_TOTAL" = "0" ]; then
            echo "id-414 gate: every in-scope Platform-corpus document processed — clean."
          else
            echo "::error::id-414 gate: the baseline walk over the Platform corpus dropped ${FAIL_TOTAL} item(s) (terminal status '${RUN_STATUS}'). Every item in this walk is an in-scope Platform-corpus document, so this is a real Platform-E2E regression — the exact silent-drop class S522 found reported as 'completed'. Per-item detail: grep the cocoindex-nightly-logs artifact for cocoindex.stage_error lines with op_id ${OP_ID}." >&2
            exit 1
          fi

      # id-400 (HARNESS §2 — OQ-397-3 RULED W2): the 10 s background walk
      # pump is DELETED. It was the direct mechanism behind the op_id
      # moving-target failure class (TRIAGE §4: #3, #13, #15, #18) — an
      # uncontracted re-stamper racing every read. Under W2, EVERY walk a
      # test needs is explicit, awaited, and attributable: stageFixture's
      # default sequence is stage → POST /walk → awaitWalk (via the
      # /walk-status registry — the NM-5 primitives in
      # __tests__/integration/cocoindex/_helpers/walk.ts), and NM-4
      # contracts the model: no background re-walk during the assertion
      # pass; every walk is requested, awaited, and attributable.

      - name: Run cocoindex Vitest go-live tier
        # File selection + --exclude list are OWNED HERE (id-412, S525 — see
        # header). Only stage-5-failure-non-destructive remains excluded. Its
        # `?failStage5=` destPath directive IS implemented as of id-414
        # AC-5/AC-6 (S535); what is still unproven is that the injected
        # credential yields a real `AuthenticationError` on the MOCK tier and
        # that flow.py resolves `status='failed'` from it. Excluded until one
        # live run shows that — see the header note for the full reasoning.
        # Every other formerly-deferred file now runs.
        #
        # Adding an --exclude here is declaring a test unverified. Say why, in
        # this comment, at the same time.
        id: cocoindex_vitest
        env:
          COCOINDEX_STAGING_URL: "http://localhost:8080"
          COCOINDEX_FIXTURE_STAGING_URL: "http://localhost:8080"
          COCOINDEX_SOURCE_PATH: ${{ env.COCOINDEX_HOST_SOURCE_PATH }}
        run: |
          set -o pipefail
          bun x vitest run --config vitest.integration.config.ts \
            __tests__/integration/cocoindex \
            form-extraction \
            --exclude '**/stage-5-failure-non-destructive.integration.test.ts' \
            2>&1 | tee /tmp/cocoindex-nightly.log

      - name: Log runner verdict
        if: always()
        env:
          COCOINDEX_OUTCOME: ${{ steps.cocoindex_vitest.outcome }}
        run: |
          set -euo pipefail
          if [ "$COCOINDEX_OUTCOME" = "success" ]; then
            echo "Cocoindex nightly: all non-excluded cases passed."
          else
            echo "Cocoindex nightly: non-zero exit — see /tmp/cocoindex-nightly.log and the uploaded artefact."
          fi
          echo "Outcome: $COCOINDEX_OUTCOME"

      # id-400: the "Stop walk pump" teardown step is retired with the pump
      # (W2 — no background walk process exists to kill). The {138.9}
      # quiesce step below still guards the teardown boundary: with no pump
      # it converges immediately unless a test-requested walk is mid-pass.

      - name: Quiesce in-flight walk before teardown ({138.9} lease shadow)
        # id-400 (W2): with the pump deleted, only a TEST-REQUESTED walk can
        # still hold the {138.9} DB-side writer-fence lease when this job
        # tears down (awaited walks normally complete inside the Vitest run;
        # a killed/timed-out test is the residual case). docker-stopping the
        # sidecar
        # MID-PASS orphans that lease for its full server-side TTL (1h,
        # writer_fence.py DEFAULT_LEASE_TTL_SECONDS) on the SHARED Staging
        # project — proven S507: run 30390422726 starved for its entire
        # 30-min walk window inside the shadow of run 30388008506's
        # teardown-orphaned lease (acquired by that run's final pump-era
        # walk, container stopped seconds later, never released — the id-382
        # release-on-cancel gap, live). Wait (bounded) until every started
        # walk has reached a terminal log line, so the lease is released by
        # normal pass completion before the container stops.
        if: always()
        run: |
          for i in $(seq 1 24); do
            LOGS="$(docker logs cocoindex-sidecar 2>&1 || true)"
            STARTS=$(printf '%s' "$LOGS" | grep -c '/walk starting pull-sync' || true)
            DONES=$(printf '%s' "$LOGS" | grep -cE '/walk completed|fence busy|update_blocking failed' || true)
            if [ "${STARTS:-0}" -le "${DONES:-0}" ]; then
              echo "sidecar quiescent after $(( (i - 1) * 5 ))s (walk starts=${STARTS}, terminals=${DONES}) — safe to stop"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::sidecar still mid-walk after 120s (starts=${STARTS}, terminals=${DONES}) — stopping anyway; the {138.9} lease may stay orphaned on the shared Staging project for up to its 1h TTL (id-382). The NEXT queued run's walk step will starve against it."

      # id-400 (HARNESS §4 — NM-8 census read gate). A run's census numbers
      # are readable only when: (i) ZERO UniqueViolations in the sidecar log
      # (the F4 identity-split signature — grepped here); (ii) the staged
      # fixture population matches the driver manifest (the census-gate
      # script — exactly one source_documents row per verify_driver dest
      # path); (iii) the same-bytes population is green at the write path
      # (evidenced inside the Vitest verdict itself — chunking C-31 /
      # idempotency-memo-hit). Gate failure fails the RUN, so a census
      # reader never ingests numbers from an unreadable run.
      # Positioned AFTER the quiesce step (PR #156 review): the gate must
      # never sample a non-quiesced sidecar — a mid-walk log read could miss
      # a UniqueViolation the in-flight pass is about to emit. `if: always()`
      # keeps it running on test failure; a docker-logs read failure fails
      # the gate CLOSED (an unreadable log is an unverifiable census).
      - name: Census read gate (NM-8)
        if: always()
        run: |
          set -euo pipefail
          SIDECAR_LOG="$(mktemp)"
          if ! docker logs cocoindex-sidecar > "$SIDECAR_LOG" 2>&1; then
            echo "NM-8 GATE FAIL: docker logs cocoindex-sidecar failed — the sidecar log is unreadable, so census readability cannot be verified" >&2
            exit 1
          fi
          UNIQUE_VIOLATIONS="$(grep -c "UniqueViolation" "$SIDECAR_LOG" || true)"
          echo "sidecar UniqueViolation occurrences: ${UNIQUE_VIOLATIONS}"
          if [ "${UNIQUE_VIOLATIONS}" -gt 0 ]; then
            echo "NM-8 GATE FAIL: ${UNIQUE_VIOLATIONS} UniqueViolation(s) in the sidecar log — census unreadable for this run" >&2
            exit 1
          fi
          bun run scripts/cocoindex-census-gate.ts

      - name: Surface pipeline-run webhook failures (post-walk)
        # flow.py logs NOTHING on a successful emission — only the unset-env
        # skip warning, "pipeline-run webhook returned HTTP <code>" (bearer
        # rejected / route 4xx-5xx), or "pipeline-run webhook emission failed"
        # (DNS, TLS, timeout — i.e. the deployed app was unreachable, the
        # stated external dependency in the header). All three are best-effort
        # and do NOT fail the walk, so without this step a broken round-trip
        # looks exactly like a healthy one until the polling cases time out.
        # Covers the whole run (initial walk + every test-requested W2 walk
        # during Vitest — id-400), hence its position after the quiesce.
        if: always()
        run: |
          set -euo pipefail
          SINCE="${COCOINDEX_WALK_LOG_SINCE:-}"
          if [ -n "$SINCE" ]; then
            HITS="$(docker logs --since "$SINCE" cocoindex-sidecar 2>&1 | grep -F "pipeline-run webhook" || true)"
          else
            HITS="$(docker logs cocoindex-sidecar 2>&1 | grep -F "pipeline-run webhook" || true)"
          fi
          if [ -n "$HITS" ]; then
            printf '%s\n' "$HITS"
            echo "::warning::The sidecar reported pipeline-run webhook problems (above). No pipeline_runs row landed for the affected emissions, so cases polling for one will have timed out. Read the body_preview to tell the modes apart: HTTP 401 with 'Protected deployment' / 'vercel_auth_enabled' = the request died at Vercel's edge and never reached the route, i.e. the URL is missing its ?x-vercel-protection-bypass=<token> query param (see the header). HTTP 401 with '{\"error\":\"Unauthorised\"}' = the route ran and rejected the bearer: PIPELINE_TRIGGER_SECRET must match the receiving app's value (verifyPipelineTriggerAuth, lib/cron-auth.ts). HTTP 400 = the route ran and authenticated; the payload failed schema validation. An emission-failed line = the app was unreachable (DNS/TLS/timeout)."
          else
            echo "No pipeline-run webhook problems in the sidecar log. flow.py is silent on success, so this is a negative signal only — the positive proof is a terminal pipeline_runs row, which the Vitest tier asserts."
          fi

      - name: Dump sidecar container logs (always — primary diagnostic)
        if: always()
        run:
          docker logs cocoindex-sidecar > /tmp/cocoindex-sidecar.log 2>&1 ||
          true

      - name: Dump mock LLM logs (mock tier — names which extractor called it)
        if: always()
        run: docker logs mock-llm > /tmp/mock-llm.log 2>&1 || true

      - name: Stop + remove sidecar container
        if: always()
        run: |
          docker stop cocoindex-sidecar >/dev/null 2>&1 || true
          docker rm cocoindex-sidecar >/dev/null 2>&1 || true
          docker stop mock-llm >/dev/null 2>&1 || true
          docker rm mock-llm >/dev/null 2>&1 || true

      - name: Upload logs (nightly run artefact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cocoindex-nightly-logs-${{ github.run_id }}
          path: |
            /tmp/cocoindex-nightly.log
            /tmp/cocoindex-sidecar.log
            /tmp/mock-llm.log
          retention-days: 14
          if-no-files-found: ignore
