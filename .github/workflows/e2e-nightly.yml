# ID-128.1 — Nightly Playwright lane (full chromium-desktop project).
#
# The PR-blocking `e2e-smoke` job in ci.yml runs only `--project=smoke`
# (~6 @smoke-tagged specs). The other 41 of the 47 e2e/tests/* specs run in
# NO workflow. This lane runs the full `chromium-desktop` project on a daily
# off-peak schedule so those specs execute somewhere automated.
#
# NOT PR-blocking — scheduled + manual only (no `pull_request` trigger). It
# hard-fails (goes red) when any spec fails so breakage is visible; the PR gate
# is unaffected. Mobile (`chromium-mobile`) is deferred to a fast-follow (v1 is
# desktop-only).
#
# ── Topology ({365.5} / DR-096 local-stack cutover) ─────────────────────────
#   build         — ONE Next.js PRODUCTION build shared by every shard
#                   ({128.6} + {128.7}: `next start` serves precompiled routes,
#                   no dev-server compile-on-first-hit). Bakes the LOCAL-stack
#                   URL + demo publishable key (scripts/ci/local-stack.env)
#                   into NEXT_PUBLIC_* — deterministic public constants, so one
#                   build serves all four shards' independent stacks.
#   e2e-shard     — 4-way `--shard` matrix (workers=2 each). Each shard boots
#                   its OWN vendor-standard local Supabase stack on its runner
#                   (pinned supabase/setup-cli + `supabase start` + `db reset`
#                   + `seed:e2e-users` — DR-096), serves the prebuilt app, and
#                   emits a `blob` report. Isolated stacks per shard: the
#                   shared-DB shard-prefix collision class is retired.
#   merge-reports — stitches the 4 blob reports into ONE aggregated HTML report
#                   (the triage artefact). Lane pass/fail = AND of the shards.
#
# The hosted-branch topology this replaces ({128.10}: provision-branch +
# teardown-branch + scripts/e2e-ephemeral-branch.ts's psql replay) is RETIRED
# by DR-096: hosted branches are preview/staging surfaces, not test
# substrates. Seed/Configure are exclusive to the git-PR GitHub-integration
# pipeline (measured across all three branch-creation modes, S494/S496/S497),
# so a programmatically-created branch can never arrive seeded; every official
# Supabase CI testing example runs the local stack instead.
#
# ── MEASUREMENT GATE (DR-096) ───────────────────────────────────────────────
# No measurement exists anywhere of the full local stack on private-repo
# runners (2 vCPU / 8 GB, vs the documented 7 GB recommendation; Supabase's
# own CI measures ~98 s median cold start on public 4 vCPU/16 GB runners,
# n=42). The FIRST run of this workflow is that measurement — the stack
# start / db reset steps below are `time`d and bracket `free -h` so the run
# doubles as the runner-tier capacity probe. Treat a red as data.
#
# Required secrets / vars (Staging environment scope — per
# docs/runbooks/github-environments.md §2): server-boot secrets
# (ANTHROPIC_API_KEY / OPENAI_API_KEY / CRON_SECRET / SENTRY_*) +
# TEST_USER_1/2/3/4 credentials. NO Supabase secrets remain in this lane: the
# stack is loopback-local and its demo credentials are public constants
# (scripts/ci/local-stack.env). SUPABASE_ACCESS_TOKEN is no longer used here.
#
# Workflow-injection mitigation: all github context + secret values arrive via
# the step-level `env:` block, never inline ${{ }} in run: steps (mirrors
# e2e-smoke + eval-nightly + staging-reference-refresh).

name: E2E nightly

on:
  schedule:
    # Daily at 04:00 UTC. The historical stagger vs the 03:00 UTC lanes is
    # kept for runner availability, though the DB-contention reason is gone —
    # this lane no longer touches any shared Supabase project (DR-096).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description:
          "Optional space-separated spec paths to run (default: full
          chromium-desktop project)"
        required: false
        default: ""
      auth_debug:
        description:
          "Set to 1 to enable [E2E_AUTH_DEBUG] fixture redirect-cause
          diagnostics"
        required: false
        default: ""

# No concurrency group: every run is self-contained (per-runner loopback
# stacks, per-run artifact names) — overlapping runs cannot interact. The old
# `e2e-nightly-ephemeral` group serialised access to the shared hosted-branch
# namespace, which no longer exists (DR-096).

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # build — ONE production build, shared by every shard ({128.6} + {128.7}).
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build (Next.js prod)
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Cache Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .next/cache
          key:
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{
            hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load local-stack constants
        # Exposes SUPABASE_URL / *_PUBLISHABLE_KEY / SERVICE_ROLE_KEY /
        # POSTGRES_PASSWORD as ambient env for the build step below — public
        # demo constants, not secrets (see the file header). Every shard runs
        # a stack that serves exactly these values (asserted per shard).
        run: grep -vE '^(#|$)' scripts/ci/local-stack.env >> "$GITHUB_ENV"

      - name: Build (Next.js prod)
        # ★ LOAD-BEARING: every NEXT_PUBLIC_* var is client-inlined
        # (lib/env-client.ts) and BAKED AT BUILD TIME, not at `next start`.
        # The Supabase values arrive ambient from the "Load local-stack
        # constants" step above — every shard's local stack serves the same
        # deterministic demo credentials on 127.0.0.1:54321, which is what
        # makes ONE build valid for four independent stacks (DR-096).
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          # VERCEL_GIT_COMMIT_SHA is Vercel-only; substitute github.sha so the Sentry release tag resolves.
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          AI_SUMMARY_MODEL: ${{ vars.AI_SUMMARY_MODEL }}
          AI_EMBEDDING_MODEL: ${{ vars.AI_EMBEDDING_MODEL }}
          AI_EMBEDDING_DIMS: ${{ vars.AI_EMBEDDING_DIMS }}
          CLASSIFICATION_BATCH_SIZE: ${{ vars.CLASSIFICATION_BATCH_SIZE }}
        run: bun run build

      - name: Archive build artifact
        run: tar --exclude='.next/cache' -czf /tmp/e2e-next-build.tar.gz .next

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-next-build
          path: /tmp/e2e-next-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # e2e-shard — 4-way shard matrix, each against its OWN local stack (DR-096).
  # ───────────────────────────────────────────────────────────────────────────
  e2e-shard:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    needs: [build]
    runs-on: ubuntu-latest
    environment: Staging
    # {365.5}: raised 20 → 30 for the cutover measurement run — the local
    # stack start + db reset are unmeasured on this runner tier. Tighten once
    # the first runs establish the real budget. The Playwright
    # --global-timeout below fails inside the runner first; this is the outer
    # backstop. {128.8} env-drives the fine budgets.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Surface EVERY failing shard — one red shard must not cancel the others.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        # chromium-desktop uses Desktop Chrome only (per playwright.config.ts).
        # `--with-deps` installs the Linux system libraries the GH-hosted runner
        # doesn't carry by default.
        run: bunx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-next-build
          path: .

      - name: Unpack build artifact
        run: tar -xzf e2e-next-build.tar.gz && rm e2e-next-build.tar.gz

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          # 2.109.1 = the DR-095 floor and the version every S496/S497
          # measurement ran on. setup-cli with no `version:` installs
          # `latest`, which drifts ~weekly — pin, bump deliberately, and
          # expect the demo-credential assert below to catch a drifted bump.
          version: "2.109.1"

      - name: Load local-stack constants
        # Ambient SUPABASE_URL / keys / POSTGRES_PASSWORD for every later step
        # — the same public demo constants the build job baked into the bundle.
        run: grep -vE '^(#|$)' scripts/ci/local-stack.env >> "$GITHUB_ENV"

      - name: Disable heavy services for CI
        # Flips `enabled = false` for studio/analytics/edge_runtime/realtime
        # in supabase/config.toml (runner-local edit). `supabase start -x` is
        # NOT sufficient: image pulls gate on config `enabled`, not the
        # exclude list (supabase/cli#4088 — the exclude-still-pulls trap).
        run: bun run scripts/ci/prepare-supabase-ci-config.ts

      - name: Start local Supabase stack (TIMED — DR-096 measurement gate)
        # First-run timings on THIS runner tier (2 vCPU/8 GB) are the DR-096
        # cutover measurement — nothing published measures the full stack
        # below 4 vCPU/16 GB. `free -h` brackets give the memory headroom.
        run: |
          nproc
          free -h
          time supabase start
          free -h

      - name: Assert running stack matches baked demo credentials
        # The build job baked scripts/ci/local-stack.env's demo keys into the
        # client bundle. If a CLI bump ever changes the local demo
        # credentials, fail LOUD here — not as unexplained 401s in specs.
        run: |
          status_json="$(supabase status -o json)"
          actual_anon="$(jq -r '.ANON_KEY' <<<"$status_json")"
          actual_service="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status_json")"
          if [ "$actual_anon" != "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Local stack ANON_KEY differs from scripts/ci/local-stack.env — CLI pin drift? Update the env file together with the setup-cli version pin."
            exit 1
          fi
          if [ "$actual_service" != "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Local stack SERVICE_ROLE_KEY differs from scripts/ci/local-stack.env — CLI pin drift? Update the env file together with the setup-cli version pin."
            exit 1
          fi
          echo "Local stack credentials match the baked constants."

      - name: Reset database (TIMED — migrations + seed.sql + buckets)
        # `db reset` is the one idempotent provisioning primitive: it replays
        # every migration, runs seed.sql, and creates all five declared
        # [storage.buckets.*] unconditionally — regardless of what `start`
        # already did on this (fresh) Docker volume. This closes the
        # zero-buckets gap that kept id-328 cluster B open on the retired
        # hosted-branch path.
        run: time supabase db reset

      - name: Seed E2E users
        # auth.users + user_roles only — seed.sql §5 defers users to this
        # script by contract. Stays a separate leg (DR-096): passwords are GH
        # secrets, seed.sql is committed, and direct SQL auth.users inserts
        # are the shape that 500'd auth.admin.listUsers() (S156 Finding 5.2).
        # SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY arrive ambient (local
        # stack).
        env:
          TEST_USER_1_PASSWORD: ${{ secrets.TEST_USER_1_PASSWORD }}
          TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
          TEST_USER_3_PASSWORD: ${{ secrets.TEST_USER_3_PASSWORD }}
          TEST_USER_4_PASSWORD: ${{ secrets.TEST_USER_4_PASSWORD }}
        run: bun run seed:e2e-users

      - name:
          Run Playwright (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal
          }})
        # Serves the prebuilt app via `next start` (PLAYWRIGHT_WEB_SERVER_CMD),
        # so routes are precompiled — no compile-on-first-hit ({128.6}). Each
        # shard emits a blob report (PW_BLOB_REPORT) that merge-reports stitches.
        # Fail-fast budgets are config-driven ({128.8}) via PW_MAX_FAILURES /
        # PW_GLOBAL_TIMEOUT_MS — no magic CLI flags. The Supabase connection
        # (SUPABASE_URL / keys / POSTGRES_PASSWORD) arrives ambient from "Load
        # local-stack constants" — this runner's own loopback stack.
        env:
          PLAYWRIGHT_WEB_SERVER_CMD: "bun run start"
          PW_BLOB_REPORT: "1"
          # {128.8}: fail-fast budgets are now config-driven — playwright.config.ts
          # reads these. {145.23} S481: raised 4→40 — at 4 every shard of the
          # S477 diagnostic run aborted at cap and 103 tests never ran, so a
          # "green" was untrustworthy as the close signal. The 18-min global
          # timeout below remains the real sick-shard backstop. Smoke/local
          # leave these unset → CI defaults (5 / 12 min).
          #
          # id-328 S493: raised 40→60. 40 was NOT effectively uncapped — the
          # worst shard of run 30071928733 produced 36 failed RESULTS
          # (18 unique failures × 2 attempts, because Playwright's counter is
          # result-shaped, not test-shaped) against a cap of 40. That is 10%
          # headroom, so one further regression would silently truncate the
          # run again and re-manufacture the untrustworthy "green" the 4→40
          # raise was meant to end.
          PW_MAX_FAILURES: "60"
          PW_GLOBAL_TIMEOUT_MS: "1080000"
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_CLIENT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AI_EMBEDDING_MODEL: ${{ vars.AI_EMBEDDING_MODEL }}
          AI_EMBEDDING_DIMS: ${{ vars.AI_EMBEDDING_DIMS }}
          # Test-user credentials — seeded onto THIS shard's local stack by
          # the "Seed E2E users" step above.
          TEST_USER_1_EMAIL: ${{ vars.TEST_USER_1_EMAIL }}
          TEST_USER_1_PASSWORD: ${{ secrets.TEST_USER_1_PASSWORD }}
          TEST_USER_2_EMAIL: ${{ vars.TEST_USER_2_EMAIL }}
          TEST_USER_2_PASSWORD: ${{ secrets.TEST_USER_2_PASSWORD }}
          TEST_USER_3_EMAIL: ${{ vars.TEST_USER_3_EMAIL }}
          TEST_USER_3_PASSWORD: ${{ secrets.TEST_USER_3_PASSWORD }}
          # TEST_USER_4 = dedicated sign-out user (S420). The `setup` project
          # authenticates all four users, so each shard needs these or setup
          # fails and every spec in the shard is skipped.
          TEST_USER_4_EMAIL: ${{ vars.TEST_USER_4_EMAIL }}
          TEST_USER_4_PASSWORD: ${{ secrets.TEST_USER_4_PASSWORD }}
          # Targeted re-run + auth diagnostics (workflow_dispatch only; both empty
          # on the scheduled run). SPECS is passed via env and expanded unquoted in
          # run: — NOT inline ${{ }} — per the workflow-injection mitigation. It is
          # a maintainer-supplied dispatch input (space-separated spec paths), not
          # attacker-controlled event data.
          SPECS: ${{ inputs.specs }}
          E2E_AUTH_DEBUG: ${{ inputs.auth_debug }}
          # Playwright shards on the FullConfig.shard the CLI flag sets below.
          SHARD_INDEX: ${{ matrix.shardIndex }}
          SHARD_TOTAL: ${{ matrix.shardTotal }}
        run:
          bunx playwright test --project=chromium-desktop
          --shard=$SHARD_INDEX/$SHARD_TOTAL --workers=2 --retries=1 $SPECS

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # merge-reports — stitch the 4 shard blob reports into ONE HTML report.
  # ───────────────────────────────────────────────────────────────────────────
  merge-reports:
    name: Merge shard reports
    needs: [e2e-shard]
    # Always aggregate — even when shards went red, the merged report is the
    # primary triage artefact (run-level pass/fail still reflects the shards).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-nightly-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
