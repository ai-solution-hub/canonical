# ID-128.5 — Nightly unconditional pytest drift insurance.
#
# ci.yml's `quality-precheck` job runs `python3 -m pytest scripts/tests/` but
# gates it behind a `paths-filter` (scripts/**/*.py, requirements.txt,
# scripts/tests/**) — intentional for PR speed (avoids a ~3-4 min pip-install
# + pytest tax on every unrelated PR). That gate has a blind spot: an
# app-side change that alters a pipeline contract (e.g. a taxonomy shape, a
# Supabase column the pipeline reads) won't touch scripts/** and so won't
# trigger the gated job, even though it could silently break the pipeline.
# This lane closes that gap by running the SAME pytest command
# unconditionally on a nightly schedule. NOT PR-blocking — failures surface
# here, not on unrelated PRs.
#
# KNOWN environment note: local sandboxed runs show failures confined to
# scripts/tests/oq/ — a local sandbox EPERM artifact (heredoc restriction),
# NOT a real regression; see scripts/CLAUDE.md "Two known full-suite
# baseline deltas". A real CI runner (this lane, and the gated ci.yml job)
# has no such sandbox restriction and runs oq/ clean. Do not attempt to
# "fix" or exclude oq/ here to hide that local-only artifact.
#
# Cadence: staggered after supabase-advisors (02:00), eval-nightly /
# staging-reference-refresh (03:00), e2e-nightly (04:00), integration-nightly
# (05:00), and cocoindex-nightly (06:00) — 07:00 UTC avoids contention on the
# shared Staging Supabase project.
#
# Required secrets / vars (Staging environment scope — per
# docs/runbooks/github-environments.md §2), mirrored from ci.yml's gated
# pytest step (kb_pipeline.config calls load_dotenv(.env.local) at import;
# in CI the file is absent so vars must come from process env):
#   Secrets:
#     SUPABASE_SERVICE_ROLE_KEY, SUPABASE_PUBLISHABLE_KEY, ANTHROPIC_API_KEY,
#     OPENAI_API_KEY
#   Vars:
#     SUPABASE_URL, AI_SUMMARY_MODEL, AI_EMBEDDING_MODEL, AI_EMBEDDING_DIMS,
#     CLASSIFICATION_BATCH_SIZE
#
# Workflow-injection mitigation: all secret/var values arrive via the
# job-level `env:` block, never inline ${{ }} in run: steps (mirrors
# eval-nightly.yml / cocoindex-nightly.yml / onprem-deploy.yml).
#
# TWO JOBS, and they are deliberately different in kind (S550):
#   * `pytest`       — the original drift insurance. Shared Staging
#                      credentials, no database of its own.
#   * `producer-sql` — ID-427 {427.17}. Provisions a DISPOSABLE loopback
#                      Supabase stack and executes the producer's SQL against
#                      it. It takes NO Supabase secrets and no `environment:`
#                      scope, because it seeds and mutates the corpus tables —
#                      the DR-131 defect class. Withholding the credentials is
#                      a stronger interlock than the suite-boundary guard.
# Owner ruling S550: nightly only. PR-blocking was considered and declined —
# it would add a `supabase start` (~3 min) to every PR touching `scripts/`,
# and this defect class is a silent-wrong-answer rather than a build break,
# so a 24-hour detection window is proportionate.

name: Pytest nightly

on:
  schedule:
    # Daily at 07:00 UTC — see cadence note above.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  # One nightly run at a time — no cancellation (queue instead) so a manual
  # dispatch never clobbers an in-flight scheduled run.
  group: pytest-nightly
  cancel-in-progress: false

jobs:
  pytest:
    name: Pytest — scripts/tests/ (unconditional)
    runs-on: ubuntu-latest
    # Staging-scoped: kb_pipeline.config reads SUPABASE_URL / keys at import
    # time. Case-sensitive — must exactly match `Staging`
    # (docs/runbooks/github-environments.md §2).
    environment: Staging
    # ci.yml's combined lint+build+pytest budget is 15 min with pytest alone
    # observed at ~3-4 min (pip install ~2m36s worst case); this job runs
    # ONLY the Python setup + pytest steps, so 15 min is generous headroom.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install pandoc
        # ID-85.1 — the B1 production image ships pandoc and local dev
        # machines have it, but ubuntu-latest runners do not. Without it,
        # docx_cell_to_markdown.py falls back to tag stripping and the
        # conversion tests in test_docx_cell_to_markdown.py fail. Installing
        # pandoc keeps those tests exercising REAL conversion (production
        # parity) rather than skipping via @requires_pandoc.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Test (pytest — unconditional, no paths-filter)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_SUMMARY_MODEL: ${{ vars.AI_SUMMARY_MODEL }}
          AI_EMBEDDING_MODEL: ${{ vars.AI_EMBEDDING_MODEL }}
          AI_EMBEDDING_DIMS: ${{ vars.AI_EMBEDDING_DIMS }}
          CLASSIFICATION_BATCH_SIZE: ${{ vars.CLASSIFICATION_BATCH_SIZE }}
        run: python3 -m pytest scripts/tests/

  producer-sql:
    # ID-427 {427.17} / S550 — the producer's SQL executed against a real
    # Postgres, not string-matched against a fake.
    #
    # WHY THIS JOB EXISTS. Every SQL assertion in the Python tier runs against
    # a `FakePool` that dispatches on MARKER SUBSTRINGS, so a predicate the
    # marker does not mention is invisible. Measured twice: dropping
    # `AND publication_status = 'published'` from both coverage queries leaves
    # the whole suite above GREEN at 2497 passed, while the executed
    # consequence is a NEGATIVE `unrouted` count rendered into `log.md` and a
    # staged commit. The `pytest` job above cannot catch that class, by
    # construction — this one can.
    #
    # A SEPARATE JOB, not extra steps on `pytest`, so a Docker/stack failure
    # here can never mask or fail the unconditional drift-insurance run that
    # is this workflow's original purpose.
    #
    # DELIBERATELY NO `environment: Staging` AND NO SUPABASE SECRETS. Every
    # other pytest lane needs them; this one must NOT have them. The tests
    # seed and mutate `source_documents` / `q_a_pairs`, which is exactly the
    # DR-131 defect class (an unattended run published 88 mock-tier
    # `q_a_pairs` into shared staging). `require_disposable_dsn` refuses any
    # non-loopback host at the suite boundary, but withholding the
    # credentials entirely is the stronger interlock: this job cannot reach a
    # shared project even if the guard were removed.
    name: Producer SQL — real Postgres (disposable stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Bun
        # Only for `prepare-supabase-ci-config.ts` below.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.4"

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          # Same pin as ci.yml's local-stack lanes — bump the two together.
          version: "2.109.1"

      - name: Disable heavy services for CI
        # Flips `enabled = false` for studio/analytics/edge_runtime/realtime
        # in supabase/config.toml (runner-local edit). `supabase start -x` is
        # NOT sufficient: image pulls gate on config `enabled`, not the
        # exclude list (supabase/cli#4088).
        run: bun run scripts/ci/prepare-supabase-ci-config.ts

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (migrations + seed)
        # The producer's SQL reads real columns, so the schema must be the
        # migration chain rather than whatever `start` left behind.
        run: supabase db reset

      - name: Producer SQL suite (gated)
        # The gate env var is what turns these from `skipped` into executed —
        # `pg_session` skips without it, which is why the suite above reports
        # them as skips rather than failures. The DSN is the CLI's public
        # local constant; loopback is the disposability signal (DR-131).
        env:
          KH_RUN_PG_INTEGRATION: "1"
          KH_PG_INTEGRATION_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          python3 -m pytest \
            scripts/tests/test_producer_sql_integration.py \
            scripts/tests/test_disposable_pg_guard.py \
            -q

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true
