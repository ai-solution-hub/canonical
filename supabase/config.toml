# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "canonical"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. ID-115: `api` is the ONLY exposed Data API schema — `public` and `graphql_public` are
# dropped, making `public` a structural PGRST106 boundary (PRODUCT INV-1/INV-2), not grant-vigilance.
# Mirror on each remote (Dashboard → Settings → API exposed-schemas, or Management API `db_schema`).
schemas = ["api"]
# Extra schemas to add to the search_path of every request. `public` stays here (orthogonal to
# exposure) so the security_invoker views' `FROM public.<t>` and the INVOKER RPC bodies resolve
# unqualified public.* refs at request time. Removing `public` from `schemas` (above) is the
# boundary; keeping it in the search_path keeps the view/RPC plumbing working.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files that describe your database.
# Supports glob patterns relative to supabase directory: "./schemas/*.sql"
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[remotes.staging]
# The Platform persistent STAGING branch (canonical's own; parent project = the
# Platform prod ref zjqbrdctesqvouboziae). Client project refs are per-client and
# never committed (ID-68 / theme 12).
project_id = "rbwqewalexrzgxtvcqrh"

[remotes.staging.db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Environment-specific auth values ({365.2}, S496). Values mirror the LIVE
# project config (read via the Management API on 26/07/2026) so a `config push`
# is a no-op until a value here deliberately changes. Selection is by
# project_id match: `supabase config push --project-ref <ref>` prints
# "Loading config override: [remotes.<name>]" — proven S496 against a throwaway
# preview branch. Preview branches match NO remote block (their ref is minted
# per-branch) and fall through to the base [auth] block below.
# Requires CLI >= 2.109.1: 2.108.0 dies mid-push at the storage leg
# (LegacyConfigPushStorageReadNetworkError, missing databasePoolMode) AFTER
# applying api/db/auth — a partial, non-atomic apply.
[remotes.staging.auth]
site_url = "https://canonical-platform-git-staging-tw-group.vercel.app"
additional_redirect_urls = [
  "https://canonical-platform-git-staging-tw-group.vercel.app/auth/callback",
  "https://canonical-platform-git-staging-tw-group.vercel.app/**",
]

# TOTP MFA is ON for both long-lived environments (dashboard-set; measured live
# 26/07/2026). Base [auth.mfa.totp] stays false for local dev + preview
# branches. S496 incident, do not repeat: a `config push` from a NON-TTY shell
# auto-applies WITHOUT confirmation — piping "N" does not abort — and the base
# false briefly disabled TOTP enrolment on staging before being restored via
# the Management API. There is NO non-interactive dry-run; treat every
# non-interactive `config push` as an apply.
[remotes.staging.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Sign-up domain restriction hook — staging branch.
# Generic, config-driven function, now carried by
# supabase/migrations/20260617130000_squash_baseline.sql:3872 (the standalone
# 20260603121652 migration was absorbed into the baseline and deleted).
# Reads the allowed domain from the single-row `public.signup_policy` config table
# (set per-environment out of band; ID-68.21 GUC->config-table pivot superseded the
# dead `app.allowed_signup_domain` GUC); FAIL-CLOSED when unset — an empty
# signup_policy rejects EVERY sign-up with a 403, it does not admit everyone.
#
# STATUS (S496, supersedes the S494 "never been applied" note): the GitHub
# integration IS now connected (26/07/2026, Automatic branching on, "Deploy to
# production" OFF), and `supabase config push --project-ref rbwqewalexrzgxtvcqrh`
# has been run and verified a NO-OP — the live (dashboard-wired) hook matches
# this block, confirmed via the Management API
# (GET /v1/projects/<ref>/config/auth), which is also the way to read config
# back — the CLI still has no `config pull`.
#
# DO NOT "fix" this by promoting the block to base `[auth.hook.before_user_created]`.
# Configure carries every `[auth.hook.*]` leg but each is pointer-guarded, so a
# preview branch currently falls through to the commented-out base block and gets
# nothing. Promoting it would silently arm a FAIL-CLOSED hook on every preview
# branch, where `signup_policy` is empty by construction — verified on a live
# branch, which returns 403 "Sign-up is currently unavailable". Seeding the policy
# row through the tenant-provisioning path is the real fix (id-367 {367.5}).
[remotes.staging.auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_signup_to_allowed_domain"

# Platform PROD ({365.2}, S496). Same regime as [remotes.staging]: values mirror
# the live project config so `config push --project-ref zjqbrdctesqvouboziae`
# is a no-op until a value here deliberately changes. The hook block mirrors the
# live (dashboard-wired) hook; auth-hook legs are pointer-guarded upstream, so
# omitting it would also leave the live value untouched — it is declared here so
# the file, not the dashboard, is the record of intent ({365.4} / DR-085).
[remotes.prod]
project_id = "zjqbrdctesqvouboziae"

[remotes.prod.auth]
site_url = "https://kh.aisolutionhub.co.uk"
additional_redirect_urls = [
  "https://canonical-platform-tw-group.vercel.app/",
  "https://canonical-platform-tw-group.vercel.app/**",
  "https://canonical-*-platform-tw-group.vercel.app",
  "https://canonical-*-platform-tw-group.vercel.app/**",
  "https://kh.aisolutionhub.co.uk/auth/callback",
  "https://kh.aisolutionhub.co.uk/**",
]

[remotes.prod.auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_restrict_signup_to_allowed_domain"

[remotes.prod.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
# [inbucket]
# enabled = true
# Port to use for the email testing server web interface.
# port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Configure local storage buckets
[storage.buckets.documents]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "text/plain", "text/markdown"]

[storage.buckets.templates]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "application/json"]

[storage.buckets.tender-documents]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document"]

# id-347 / id-328 cluster B (S493). These two were previously undeclared, and
# the consequences were live on every project:
#
#   * `corpus` existed on NO project — not Platform staging, not Platform prod,
#     not any ephemeral branch. It had a provisioning script
#     (scripts/provision-corpus-bucket.ts, {138.8}) that was wired into nothing
#     and had never been run against anything. That is the source of the
#     nightly's `corpus bucket "corpus" is not provisioned in this project —
#     upload rejected` (lib/upload/folder-drop.ts:349). Declaring it here
#     retires that script.
#
#     THE REMOTE APPLY COMMAND IS `supabase seed buckets --linked`, NOT
#     `config push`. Re-verified S494 against CLI 2.108.0 source, and the
#     situation is worse than the S493 note claimed. `ToUpdateStorageConfigBody()`
#     (`pkg/config/storage.go:63-127`) builds a body of `FileSizeLimit` +
#     `Features{IcebergCatalog, ImageTransformation, S3Protocol, VectorBuckets}`
#     only. The `Buckets` field exists on the struct (`storage.go:19`,
#     `toml:"buckets"`) and is NEVER READ by the update path
#     (`internal/config/push/push.go:42` -> `pkg/config/updater.go:20-37`, five
#     legs: api/db/auth/storage/experimental -> `updater.go:272-301`).
#     Buckets cannot even reach the DIFF: `DiffWithRemote`
#     (`storage.go:152-165`) round-trips through `FromRemoteStorageConfig`,
#     which overwrites only file-size/features, so `Buckets` is byte-identical
#     on both sides and cancels. If ONLY buckets differ, `config push` prints
#     "Remote Storage config is up to date." and makes no HTTP call at all.
#     Supabase staff confirm the same in supabase/cli#4731.
#
#     Note the flag asymmetry, which is the opposite way round from the S493
#     note: `config push` DOES accept `--project-ref` (so it needs no prior
#     `supabase link`), while `seed buckets` takes only `--linked` and so DOES
#     need one. That asymmetry is what {365.5} has to design around, since
#     `e2e-nightly.yml:242` deliberately stays stateless with no `link` step.
#
#     BRANCH REACH, measured S496 — the answer is split by HOW the branch is
#     made. A GIT-TRIGGERED preview branch (GitHub integration, PR required —
#     the integration's own check-run says "open a PR to create a new branch")
#     DOES seed every bucket declared here: all five appeared on a throwaway
#     branch with mime types intact (Seed step, gated behind Migrate). A
#     dashboard-created branch gets ZERO (S494 measurement, still true). And
#     `scripts/e2e-ephemeral-branch.ts` replays migrations + `seed.sql` through
#     raw `psql`, never invokes the CLI (no `supabase/setup-cli` in any
#     workflow), so OUR e2e ephemeral branches still have ZERO buckets —
#     id-328 cluster B and {128.10} stay OPEN on that axis only; CI wiring is
#     tracked on id-365 {365.5}. Note the branch inherited the global 50MiB cap
#     on `onprem-backups` ({365.6}).
#   * `onprem-backups` existed on both Platform projects but was declared
#     nowhere: hand-created 2026-06-25 with null size and null mime limits,
#     which is the signature of dashboard/API creation rather than config.
#     CAVEAT, measured not assumed: omitting `file_size_limit` here does NOT
#     reproduce the live NULL — the bucket inherits the global
#     `[storage] file_size_limit = "50MiB"` above (verified on a local reset).
#     The live projects therefore still differ from this declaration, and a
#     `seed buckets` run WOULD cap them at 50MiB. Decide the real cap before
#     running it anywhere near the backup bucket: archives may exceed it.
#
# Separately, and unrelated to buckets: `config push` at the long-lived
# projects is SAFE ONLY via the [remotes.staging]/[remotes.prod] blocks (S496:
# selection by project_id match is proven — the CLI prints "Loading config
# override: [remotes.<name>]"), on CLI >= 2.109.1, and each block mirrors the
# live values so a push is a no-op until a value deliberately changes. Two
# standing hazards: non-tty `config push` AUTO-APPLIES with no confirmation and
# has no dry-run; and a project with NO matching remote block gets the base
# local-dev [auth] (site_url 127.0.0.1) — never push at a ref without a block.
#
# Deliberately NO `allowed_mime_types` on `corpus`: it is a heterogeneous
# store. write-back.ts stamps CORPUS_OBJECT_CONTENT_TYPE, but folder-drop.ts
# forwards whatever `contentType` the caller supplied, so an allowlist here
# would silently start rejecting uploads that work today.
[storage.buckets.corpus]
public = false
file_size_limit = "50MiB"

[storage.buckets.onprem-backups]
public = false

# Uncomment to allow connections via S3 compatible clients
